# CrowdSec IP blocking is handled by blocked_ips.conf files:
#   - Global:    http.d/blocked_ips.conf          (included by default.conf)
#   - Per-conn:  http.d/conn_N/blocked_ips.conf   (included by each connection's N.conf)
# Both are auto-generated by blocked-ips-updater every 15s and the WAF backend on block/unblock actions.
# Lua-based bouncer (cs-nginx-bouncer) is incompatible with plain Angie — it requires OpenResty's lua-resty-core
