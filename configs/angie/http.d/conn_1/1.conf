server {
    listen 80;
    server_name zwarder.ru;

    # GeoIP JSON access log for dashboard analytics
    access_log /var/log/angie/geoip.log with_geoip_json;

    include http.d/conn_1/blocked_ips.conf;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /etc/angie/http.d/conn_1/site;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zwarder.ru;

    # GeoIP JSON access log for dashboard analytics
    access_log /var/log/angie/geoip.log with_geoip_json;

    include http.d/conn_1/blocked_ips.conf;
    ssl_certificate /etc/angie/http.d/conn_1/1.crt;
    ssl_certificate_key /etc/angie/http.d/conn_1/1.key;

    # HSTS (force HTTPS, prevent downgrade attacks)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ModSecurity integration
    modsecurity on;
    modsecurity_rules_file /etc/angie/modsecurity/rules.conf;


    root /etc/angie/http.d/conn_1/site;
    index index.html;

    # Proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Serve static files for frontend
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}