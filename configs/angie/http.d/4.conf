server {
    listen 80;
    acme default;
    server_name demo.waf.local;

    location /.well-known/acme-challenge/ {
        # ACME challenge handled by Angie ACME module
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demo.waf.local;

    ssl_certificate /etc/angie/http.d/4.crt;
    ssl_certificate_key /etc/angie/http.d/4.key;

    # ModSecurity integration
    modsecurity on;
    modsecurity_rules_file /etc/angie/modsecurity/rules.conf;

    location / {
        root /var/www/examples;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}