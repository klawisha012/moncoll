## Connection: demo-site (ID: 3)
## Mode: proxy
## Generated at: 2026-05-08T00:03:00.000000Z

server {
    listen 80;
    server_name demo.waf.local www.demo.waf.local;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demo.waf.local www.demo.waf.local;

    ssl_certificate /etc/angie/http.d/conn_3/3.crt;
    ssl_certificate_key /etc/angie/http.d/conn_3/3.key;

    # ModSecurity integration
    modsecurity on;
    modsecurity_rules_file /etc/angie/modsecurity/rules.conf;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}