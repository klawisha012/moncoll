# HTTP server: redirects to HTTPS for browsers, but also serves /debug for CLI tools
server {
    listen       80;
    server_name  localhost;
    modsecurity on;
    modsecurity_rules_file /etc/angie/modsecurity/rules.conf;
    # Access log in combined format for CrowdSec
    access_log /var/log/angie/access.log combined;
    # GeoIP log in JSON format
    access_log /var/log/angie/geoip.log with_geoip_json;
    # CrowdSec IP blocking via deny directives (auto-generated by blocked-ips-updater)
    include http.d/blocked_ips.conf;

    # Debug/GeoIP test endpoint — ModSecurity inspects requests here
    location /debug {
        echo "ip = $http_x_forwarded_for";
        echo "Country: $geoip2_data_country_name";
        echo "Country Code: $geoip2_data_country_code";
        echo "City: $geoip2_data_city_name";
        echo "Postal Code: $geoip2_data_postal_code";
        echo "Latitude: $geoip2_data_latitude";
        echo "Longitude: $geoip2_data_longitude";
        echo "ASN: $geoip2_data_asn";
        echo "Organization: $geoip2_data_organization";
    }

    location / {
    root   /usr/share/angie/html;
    index  index.html index.htm;
    }

    location /status/ {
        api     /status/;
        allow   127.0.0.1;
        deny    all;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/angie/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with angie's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}

}
