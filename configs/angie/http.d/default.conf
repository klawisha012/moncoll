# Default catch-all server — handles requests to unmatched domains
# (e.g., localhost, IP address, unknown Host headers).
# All requests pass through ModSecurity and are logged for dashboard analytics.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # GeoIP JSON access log for dashboard analytics
    access_log /var/log/angie/geoip.log with_geoip_json;

    # ModSecurity integration
    modsecurity on;
    modsecurity_rules_file /etc/angie/modsecurity/rules.conf;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Default response for non-API requests
    location / {
        default_type text/plain;
        return 200 "WAF Active\n";
    }
}
