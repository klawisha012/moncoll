server {
    listen 443 ssl;
    server_name zwarder.ru;

    # GeoIP JSON access log for dashboard analytics
    access_log /var/log/angie/geoip.log with_geoip_json;

    include http.d/conn_44/blocked_ips.conf;
    ssl_certificate /etc/angie/http.d/conn_44/44.crt;
    ssl_certificate_key /etc/angie/http.d/conn_44/44.key;

    # HSTS (force HTTPS, prevent downgrade attacks)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ModSecurity integration
    modsecurity on;
    modsecurity_rules_file /etc/angie/modsecurity/rules.conf;

    root /etc/angie/http.d/conn_44/site;
    index index.html index.htm;
    try_files $uri $uri/ =404;
