# WAF Admin Panel Virtual Host for admin domains.
# Serves the React Frontend SPA (port 3000) when accessing via zwarder.ru or waf.zwarder.ru.
#
server {
    listen 80;
    listen [::]:80;
    server_name zwarder.ru waf.zwarder.ru;

    # Log access for dashboard tracking (optional, standard log is fine)
    access_log /var/log/angie/access.log combined;

    # Disable ModSecurity for the admin panel control plane to prevent false positives on management actions
    modsecurity off;

    # ACME HTTP-01 challenge routing (in case Let's Encrypt renewal is needed for these specific domains)
    location ^~ /.well-known/acme-challenge/ {
        root /etc/angie/http.d/_default/site;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSockets support (for Centrifugo connection if routed via same host)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zwarder.ru waf.zwarder.ru;

    access_log /var/log/angie/access.log combined;

    ssl_certificate     /etc/angie/http.d/_default/default.crt;
    ssl_certificate_key /etc/angie/http.d/_default/default.key;

    modsecurity off;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
