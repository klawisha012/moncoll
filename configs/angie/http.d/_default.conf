# Default fallback server.
#
# angie.conf has no inline server blocks — every vhost is added by the
# backend as `conn_<id>/<id>.conf`. On a fresh checkout (CI, new dev box)
# `http.d/` is empty, so Angie boots but binds nothing on :80. This file
# guarantees a baseline listener so:
#   1. `docker compose up --wait` healthcheck succeeds
#   2. e2e curl-loops on http://localhost:80/ return 200
#   3. Per-connection configs still take precedence via `server_name`
#
# WAF note: ModSecurity is enabled globally at http {} scope (see
# angie.conf) so this server inherits it. To make CRS *actually* block
# attacks here we proxy_pass to a private loopback sink instead of
# `return 200`. Synthetic `return` short-circuits the content phase and
# skips ModSec phase 2 — CRS XSS/SQLi/LFI rules live in phase 2 and
# would never fire. With proxy_pass the full request lifecycle runs,
# CRS evaluates, and only clean requests reach the sink.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Log every default-fallback request (including WAF-denied 403s) so
    # local-test attacks (`curl -H "X-Forwarded-For: 8.8.8.8" localhost/...`)
    # show up on the dashboard's GeoIP map. Without this, ModSec writes the
    # attack to audit.log but the access log → Vector → ClickHouse
    # `nginx_access_log` pipeline never sees it, and the map stays empty.
    access_log /var/log/angie/geoip.log with_geoip_json;
    access_log /var/log/angie/access.log combined;

    location = /healthz {
        access_log off;
        modsecurity off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}

# Internal sink — answers the WAF-filtered default-server proxy_pass.
# Bound to loopback only; never reachable from outside the container.
# modsecurity off so the same request isn't double-inspected.
server {
    listen 127.0.0.1:8081;
    server_name _;
    modsecurity off;

    location / {
        return 200 "angie default\n";
    }
}
