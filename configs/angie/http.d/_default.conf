# Default fallback server.
#
# angie.conf has no inline server blocks — every vhost is added by the
# backend as `conn_<id>/<id>.conf`. On a fresh checkout (CI, new dev box)
# `http.d/` is empty, so Angie boots but binds nothing on :80. This file
# guarantees a baseline listener so:
#   1. `docker compose up --wait` healthcheck succeeds
#   2. e2e curl-loops on http://localhost:80/ return 200
#   3. Per-connection configs still take precedence via `server_name`
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # GeoIP JSON access log for dashboard analytics.
    # Vector tails /var/log/angie/geoip.log; without this directive the default
    # vhost falls through to Angie's built-in combined format, which is never
    # shipped to ClickHouse and never gets the http-level real_ip / GeoIP
    # variables resolved into JSON fields.
    access_log /var/log/angie/geoip.log with_geoip_json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 200 "angie default\n";
    }
}
