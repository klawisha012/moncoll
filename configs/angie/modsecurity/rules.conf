Include modsecurity.conf

# To enable the OWASP CRS, please perform the following steps:
#
# 1. Checkout Core Rule Set from GitHub and create config files as shown below:
#
#      cd /var/lib/angie/modsecurity
#      sudo git clone -b v3.3.5 -c advice.detachedHead=false https://github.com/coreruleset/coreruleset
#      sudo cp coreruleset/crs-setup.conf.example coreruleset/crs-setup.conf
#      sudo cp coreruleset/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf.example \
#              coreruleset/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#      sudo cp coreruleset/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf.example \
#              coreruleset/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
#
# 2. Uncomment both 'Include' directives below

Include /var/lib/angie/modsecurity/coreruleset/crs-setup.conf
Include /var/lib/angie/modsecurity/coreruleset/rules/*.conf

# NOTE: a catch-all `SecRule REQUEST_URI "@rx .*" ... auditlog` rule was removed
# here. With the `auditlog` action it forced EVERY request (including clean 2xx
# health checks from the Docker gateway) into modsec_audit.log, flooding the
# dashboard feed with noise "1001/INFO" rows and inflating the BlockedThreats
# metric (which counts waf_audit_log rows). Real detections are still logged via
# SecAuditEngine RelevantOnly (4xx/5xx) and the anomaly-score rules below.

# Force audit logging in DetectionOnly mode when an anomaly score > 0 is detected.
# This ensures that malicious requests are captured in logs and visible in the UI
# even when WAF is not actively blocking them.
SecRule TX:anomaly_score "@gt 0" "id:200010,phase:2,t:none,nolog,pass,ctl:auditEngine=On"
SecRule TX:anomaly_score "@gt 0" "id:200011,phase:5,t:none,nolog,pass,ctl:auditEngine=On"
