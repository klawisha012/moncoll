# Custom CrowdSec scenario for detecting HTTP scanning (sequential 404s)
# This scenario detects when an IP makes many requests resulting in 404 errors

type: trigger
name: crowdsecurity/http-scan-404
description: "Detect IPs scanning for non-existent resources (many 404s)"
filter: "evt.Meta.service == 'http' && evt.Meta.http_status == '404'"
groupby: evt.Meta.source_ip
capacity: 0
leakspeed: 10s
blackhole: 1m
labels:
  service: http
  type: scan
  remediation: true
