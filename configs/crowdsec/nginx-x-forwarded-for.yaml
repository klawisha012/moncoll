# Custom parser to extract real IP from X-Forwarded-For header in Nginx logs
# This parser should run after nginx-logs parser

filter: "evt.Parsed.program == 'nginx' && evt.Parsed.http_x_forwarded_for != ''"
debug: false
onsuccess: next_stage
name: crowdsecurity/nginx-x-forwarded-for
description: "Extract real IP from X-Forwarded-For header"

# If X-Forwarded-For exists, use it as source IP
statics:
  - target: evt.Meta.source_ip
    expression: "evt.Parsed.http_x_forwarded_for"
  - target: evt.Meta.service
    value: http
