global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # App metrics now come from the Go backend, which serves Prometheus
  # metrics on a dedicated port (:9100, WAF_GO_METRICS_ADDR default).
  - job_name: "gobackend"
    static_configs:
      - targets: ["gobackend:9100"]