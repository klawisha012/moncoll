[server]
http_port = 3000
domain = localhost
  # Serve Grafana under /grafana subpath via Nginx reverse proxy.
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
  enforce_domain = false
  serve_from_sub_path = true

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[log]
mode = console
level = info
filters =

[dataproxy]
logging = true
timeout = 30

[auth]
disable_login_form = false
disable_signout_menu = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = true
org_name = 
org_role = Viewer

[dashboard]
versions_to_keep = 20

[panels]
disable_sanitize_html = false

[metrics]
enabled = true
interval_seconds = 10

[log.console]
format = text

[log.file]
log_rotate = true
max_days = 7

[log.syslog]
enabled = false

[security]
admin_password = admin
secret_key = SW2Yw344OW0kOH14cmk8
cookie_samesite = lax
cookie_secure = false
disable_gravatar = false
allow_embedding = true

[plugins]
enabled = true
allow_loading_unsigned_plugins = false

[feature_toggles]
enable_access_control = true
enable_adhoc_filters = true
enable_alerting = true
enable_azure_ad = false
enable_benchmarks = false
enable_contact_points = true
enable_custom_annotations = true
enable_dashboard_annotations = true
enable_datasource_proxy = true
enable_delete_annotation = true
enable_external_userinfo = true
enable_graphite = true
enable_legacy_alerting = false
enable_legacy_ui = true
enable_linenumber = true
enable_locale = true
enable_metrics = true
enable_openai = false
enable_playlists = true
enable_public_dashboards = false
enable_search = true
enable_share = true
enable_simple_json_datasource = true
enable_swagger = true
enable_tempo = false
enable_test_data = true
enable_traceql = false
enable_translations = true
enable_unicode_collation = true
enable_user_list = true
enable_users_page = true

[live]
max_connections = 100
allowed_origins = *
heartbeat_interval = 30s

[tracing]
enabled = false
sampling_rate = 1.0
jaeger_endpoint = 
zipkin_endpoint = 

[unified_alerting]
enabled = true
