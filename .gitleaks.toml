# gitleaks v8 config — allowlist for known dev-only artefacts.
#
# Each allowlist entry documents WHY a path is safe to skip so future
# auditors can re-evaluate. Do NOT extend this file without a code review.
#
# Requires gitleaks >= 8.22.0 for the [[allowlists]] (plural) syntax.
# The CI workflow pins gitleaks v8.28.0; bump that in lockstep if you
# change which syntax this file uses.

[extend]
useDefault = true

# ── 1. WAF runtime TLS material ────────────────────────────────────────
# Per-connection .key files are generated by the backend's self-signed /
# ACME flow at runtime; they're already gitignored going forward (see
# .gitignore). Historical commits still contain them but they refer to
# expired self-signed material from local dev only.
[[allowlists]]
description = "WAF per-connection runtime TLS keys (dev/self-signed)"
paths = [
    '''^configs/angie/http\.d/.*\.key$''',
    '''^configs/angie/acme/.*\.key$''',
]

# ── 2. Dev session cookie jar ──────────────────────────────────────────
# `cookies.txt` is produced by local `curl` smoke runs; the JWT inside
# was tied to a dev admin account whose password was rotated on
# 2026-05-19. Never used by CI or prod.
[[allowlists]]
description = "Dev cookies.txt from local curl runs"
paths = ['''^cookies\.txt$''']

# ── 3. WAF generated reports & test fixtures ───────────────────────────
# Make sure CI never trips on its own report artefact or test fixtures
# that intentionally contain dummy secrets.
[[allowlists]]
description = "Gitleaks own report + test fixtures"
paths = [
    '''^\.gitleaks-report\.json$''',
    '''^tests/.*/fixtures/.*$''',
]

# ── 4. Historical CrowdSec bouncer API key (rotated) ───────────────────
# Commit 88dfb72 ("docs: add presentation screens", 2026-05-21) accidentally
# replaced the placeholder in crowdsec-nginx-bouncer.conf with a real
# CrowdSec bouncer key. The key was rotated on 2026-05-22 and the file
# restored to the __CHANGE_ME__ placeholder in a follow-up commit. The
# leaked value is no longer valid, but it lives forever in git history,
# so we pin the commit SHA here to keep CI green without weakening the
# leak detector for future regressions on the same path.
[[allowlists]]
description = "Rotated CrowdSec bouncer key, commit 88dfb72 (no longer valid)"
commits = ["88dfb7214d97510d7e7e70b60538457b9a5714fb"]

# ── 5. Historical auto-generated k8s deploy secrets (superseded) ────────
# k8s/waf-secrets.yaml is AUTO-GENERATED by deploy-k8s.sh and gitignored.
# It was accidentally committed in two deploy runs (commits below), each
# carrying a DIFFERENT randomly-generated set (POSTGRES / CLICKHOUSE / JWT /
# PASETO / CrowdSec / Centrifugo). Both sets are superseded: the live stack's
# .env uses none of these values (verified 2026-06-13), and deploy-k8s.sh
# regenerates them on every run. Pinned by commit (not path) so future
# commits to the same path are still scanned.
[[allowlists]]
description = "Auto-generated k8s deploy secrets, superseded (dc577f6, f36444e + set-2 dupe 9e71fea on the `k8s` backup branch)"
commits = [
    "dc577f6b079441f01e4bf5883190017ee216527e",
    "f36444efbeb6b55546a5c84f70bc3418817c564e",
    "9e71feaa44c91909fab9eca13b38001a3c87032c",
]

# ── 6. Historical Grafana credentials (superseded / default) ───────────
# The Grafana ClickHouse datasource once hardcoded a password (now
# ${CLICKHOUSE_PASSWORD}); the leaked value is superseded — not in the live
# .env (verified 2026-06-13). grafana.ini carried `admin_password = admin`,
# the literal Grafana default. Pinned by commit, not path, so a future real
# secret on these paths is still caught.
[[allowlists]]
description = "Superseded Grafana datasource password + default admin_password (incl. dupe 6a70fbe on the `hvnzo_branch` backup branch)"
commits = [
    "0ab03fa5399bb772ee7064bfb39bc76993574372",
    "19265af18726ab65c53f3711ab2e3a1c8f068e78",
    "502c1b27aa40b8863d4c9014c78a45218a3fc534",
    "d265e54f3e61c263f7be99af653d4898432317e6",
    "fe0ed28849a6972fef8f2ef6ac40ffdd64c1843b",
    "257b5cdd187ae94821a87794c24465cd2bea7fdd",
    "368bafb61629a7f96ba7d1929d61a10db9fac406",
    "6a70fbe197a46f2d257562af7ba5d9c01e36ca47",
]

# ── 7. Go unit-test crypto fixtures (dummy vectors) ────────────────────
# fernet_test.go pins the canonical pyotp test secret "JBSWY3DPEHPK3PXP";
# config_test.go pins a sequential test PASETO hex key (00112233...eeff).
# Both are intentional, well-known test vectors — not real secrets. Pinned
# by exact path (not a blanket *_test.go rule) so other test files are still
# scanned.
[[allowlists]]
description = "Go crypto unit-test fixtures (dummy vectors)"
paths = [
    '''^gobackend/internal/auth/fernet_test\.go$''',
    '''^gobackend/internal/config/config_test\.go$''',
]

# ── 8. Historical kubeconfig client key (UNTRACKED + must be rotated) ───
# The kubeconfig carried client-key-data (a cluster client private key) +
# client-certificate-data for a 127.0.0.1:6443 cluster. gitleaks' default
# ruleset missed it because it is base64-wrapped, not raw PEM; the
# kubeconfig-client-credential rule below now catches future ones. The file is
# untracked + gitignored as of this branch, but the key lives in history at two
# reachable commits — both pinned to keep CI green:
#   f2a67e0  introduced it at the old path k8s/kubeconfig.yaml (2026-05-27)
#   94e50f6  carried it through the repo-layout reorg → containers/k8s/ (2026-06-08)
# ACTION: a client cert cannot be password-rotated — revoke/reissue it on the
# cluster. Blast radius is limited (loopback API server, private repo), but the
# key is in history forever; scrub history if the repo is ever made public.
[[allowlists]]
description = "Historical kubeconfig client key, commits f2a67e0 (intro) + 94e50f6 (reorg); untracked + gitignored; rotate on cluster"
commits = [
    "f2a67e07329b473674cb16860621ebb4d9acb113",
    "94e50f6b56caee993b5ade15414b6b85fedfbcaf",
]

# ── Custom rule: detect kubeconfig client credentials ──────────────────
# The default ruleset does not flag base64-wrapped kubeconfig keys, which is
# how containers/k8s/kubeconfig.yaml slipped in. Catch them going forward.
[[rules]]
id = "kubeconfig-client-credential"
description = "Kubeconfig client private key / certificate (base64-encoded PEM)"
regex = '''(?:client-key-data|client-certificate-data)\s*:\s*[A-Za-z0-9+/]{128,}={0,2}'''
keywords = [
    "client-key-data",
    "client-certificate-data",
]
