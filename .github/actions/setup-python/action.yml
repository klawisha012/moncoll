name: Setup Python (backend)
description: Install Python with pip cache and project dependencies.
inputs:
  python-version:
    description: Python interpreter to install
    required: false
    default: "3.11"
  install-test-deps:
    description: "Also install tests/requirements.txt (pytest, factory-boy, ...)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      # actions/setup-python@v5.2.0
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          tests/requirements.txt

    - name: Install backend dependencies
      shell: bash
      run: pip install -r backend/requirements.txt

    - name: Install test dependencies
      if: inputs.install-test-deps == 'true'
      shell: bash
      run: pip install -r tests/requirements.txt
