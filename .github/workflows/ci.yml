name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Lint ───────────────────────────────────────────
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install lint tooling
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  # ─── Backend Unit + Integration Tests ───────────────────────
  backend-tests:
    name: Backend - Unit & Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: pytest -m unit tests/unit -v --tb=short

      - name: Run integration tests
        env:
          PYTHONPATH: backend
        run: pytest -m integration tests/integration -v --tb=short

  # ─── Frontend Lint & Build ───────────────────────────────
  frontend-checks:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─── Docker Build Verification ──────────────────────────
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint, backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: waf-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: waf-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build angie image
        uses: docker/build-push-action@v5
        with:
          context: ./configs/angie
          push: false
          tags: waf-angie:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── E2E Tests (full Docker stack) ───────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate .env
        run: bash scripts/generate-env.sh

      - name: Start Docker stack
        run: docker compose up -d --build --wait
        timeout-minutes: 12

      - name: Wait for services healthy
        run: |
          echo "Waiting for services to be ready..."
          for i in $(seq 1 30); do
            if curl -sf --no-keepalive http://localhost:80/ > /dev/null 2>&1; then
              echo "WAF is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Ensure audit log exists
        run: |
          docker exec waf-angie-1 mkdir -p /var/log/angie
          docker exec waf-angie-1 touch /var/log/angie/modsec_audit.log

      - name: Run modsecurity e2e suite
        run: |
          pytest -m e2e \
            tests/e2e/modsecurity/test_sqli_942.py \
            tests/e2e/modsecurity/test_xss_941.py \
            tests/e2e/modsecurity/test_lfi_930.py \
            -v --tb=short -x
        continue-on-error: true
        id: e2e-waf

      - name: Run connections e2e suite (nginx, static, container, docker_compose)
        run: |
          pytest -m e2e tests/e2e/connections -v --tb=short
        continue-on-error: true
        id: e2e-conn

      - name: Collect logs on failure
        if: steps.e2e-waf.outcome == 'failure' || steps.e2e-conn.outcome == 'failure'
        run: |
          docker compose logs --tail=200 > docker-logs.txt 2>&1
          echo "::warning::E2E tests failed. Check docker-logs.txt artifact."

      - name: Upload logs artifact
        if: steps.e2e-waf.outcome == 'failure' || steps.e2e-conn.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  # ─── Security Scan ──────────────────────────────────────
  security-scan:
    name: Security - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint, backend-tests, frontend-checks]

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: waf-backend:scan

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: waf-backend:scan
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy backend results
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-backend.sarif"
          category: backend

      - name: Build frontend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: waf-frontend:scan

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: waf-frontend:scan
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy frontend results
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-frontend.sarif"
          category: frontend
