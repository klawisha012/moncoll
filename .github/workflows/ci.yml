name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter (the `paths` pre-flight job) calls the PR "list files"
  # API on pull_request events; without pull-requests:read it 403s
  # ("Resource not accessible by integration"), the filter outputs never get
  # set, and EVERY downstream job skips — making ci-required a vacuous pass.
  pull-requests: read

# Silence the "Node.js 20 actions are deprecated" warnings until every
# third-party action ships a Node-24 release. Safe to remove once all
# pinned actions natively target Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel in-flight PR runs when a new commit lands; NEVER cancel main builds
# (we want the deploy-gating sequence to complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Path filter primer — full pipeline runs only when production paths change.
# Doc-only PRs are short-circuited by the `paths-filter` job below.
defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────────────────────────────────────
  # Pre-flight: decide which downstream stages need to run.
  # Cheap (~5s) so we always run it and let it gate the rest.
  # ─────────────────────────────────────────────────────────────
  paths:
    name: Pre-flight - Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend:  ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      docker:   ${{ steps.f.outputs.docker }}
      ci:       ${{ steps.f.outputs.ci }}
      loadtest: ${{ steps.f.outputs.loadtest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: f
        # dorny/paths-filter@v3.0.2
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            backend:
              - 'gobackend/**'
              - 'pyproject.toml'
            frontend:
              - 'frontend/**'
            docker:
              - 'configs/angie/**'
              - 'gobackend/**'
              - 'frontend/**'
              - 'docker-compose.yaml'
            ci:
              - '.github/**'
            loadtest:
              - 'tests/loadtest/**'
              - 'configs/angie/**'

  # ═════════════════════════════════════════════════════════════
  # STAGE 1 — validate (fast, parallel, runs on every PR)
  # ═════════════════════════════════════════════════════════════

  frontend-lint:
    name: 1. validate - frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: paths
    if: |
      needs.paths.outputs.frontend == 'true'
      || needs.paths.outputs.ci == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
      - name: ESLint (if configured)
        working-directory: frontend
        run: |
          if [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ] || [ -f eslint.config.js ]; then
            npx eslint . --max-warnings=0
          else
            echo "::notice::No ESLint config — skipping"
          fi

  frontend-typecheck:
    name: 1. validate - frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: paths
    if: |
      needs.paths.outputs.frontend == 'true'
      || needs.paths.outputs.ci == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

  workflow-lint:
    name: 1. validate - workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: paths
    if: |
      needs.paths.outputs.ci == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install actionlint
        # Pinned to the v1.7.4 release tag instead of `main` HEAD so a
        # compromise of rhysd/actionlint's main branch can't tamper with
        # the install script. Tag is effectively immutable; for stronger
        # guarantees pin to a commit SHA. See
        # .gstack/security-reports/2026-05-20-043200.json F5.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash) 1.7.4
      - name: Run actionlint
        run: ./actionlint -color

  # ═════════════════════════════════════════════════════════════
  # STAGE 2 — test (depends on validate; jobs parallelise inside)
  # ═════════════════════════════════════════════════════════════

  frontend-build:
    name: 2. test - frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [paths, frontend-lint, frontend-typecheck]
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') && (
        needs.paths.outputs.frontend == 'true'
        || needs.paths.outputs.ci == 'true'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ═════════════════════════════════════════════════════════════
  # STAGE 3 — build (matrix; depends on test passing)
  # ═════════════════════════════════════════════════════════════

  images:
    name: 3. build - ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [paths, frontend-build]
    # Skip the matrix entirely on doc-only PRs.
    # !cancelled() + failure-check pattern prevents the cascading-skip bug:
    # if frontend-build is SKIPPED (e.g. backend-only PR), default success()
    # would also skip this job. We want it to run when its OWN paths matched.
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') && (
        needs.paths.outputs.docker == 'true'
        || needs.paths.outputs.ci == 'true'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gobackend
            context: ./gobackend
          - image: frontend
            context: ./frontend
          - image: angie
            context: ./configs/angie
    permissions:
      contents: read
      # packages:write — required for the GHCR push step. PR builds skip the
      # push (see `push:` below) so this permission only matters on main.
      packages: write
      # Required by github/codeql-action/upload-sarif below — without this
      # the Trivy image scan step fails with "Resource not accessible by
      # integration".
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Buildx
        # docker/setup-buildx-action@v3.7.1
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      # Log in to GHCR only on main pushes — the build itself runs on PRs,
      # but we never push PR builds (would pollute the registry and grant
      # write access to fork PRs).
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # docker/login-action@v3.3.0
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Compute the registry tags. docker/metadata-action lowercases the
      # image path (GHCR requires it) and emits OCI labels.
      - name: Compute image tags
        id: meta
        # docker/metadata-action@v5.5.1
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build ${{ matrix.image }}
        id: build
        # docker/build-push-action@v6.9.0
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: ${{ matrix.context }}
          # Push only on main pushes; PR builds stay local for Trivy.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: true
          # ONLY metadata-action tags. An unqualified tag like
          # `waf-<image>:<sha>` would be interpreted by buildx as a Docker
          # Hub push (registry-1.docker.io/library/...) on `push:true` and
          # 401 the whole build. Trivy scans the first GHCR tag instead
          # (see `image-ref` below) — buildx loads it into the local daemon
          # because `load:true` is set.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Save image digest
        run: |
          mkdir -p .digests
          echo "ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest || 'no-digest' }}" \
            > .digests/${{ matrix.image }}.txt
      - name: Upload digest
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: digest-${{ matrix.image }}
          path: .digests/${{ matrix.image }}.txt
          retention-days: 7
      # Trivy must run in this matrix job (not a downstream one) because the
      # built image lives on this runner's local Docker daemon. A separate
      # job on a fresh runner would scan an empty daemon and fail to find
      # the image. `tags[0]` is the first metadata-action tag (e.g. the
      # branch ref); load:true above has aliased it into the local daemon.
      - name: Trivy image scan (${{ matrix.image }})
        # aquasecurity/trivy-action@0.28.0
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: "trivy-image-${{ matrix.image }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload SARIF (image ${{ matrix.image }})
        # github/codeql-action/upload-sarif@v3.27.0
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        continue-on-error: true
        with:
          sarif_file: "trivy-image-${{ matrix.image }}.sarif"
          category: "trivy-image-${{ matrix.image }}"

  # ═════════════════════════════════════════════════════════════
  # STAGE 4 — quality (parallel; depends on build for image scans)
  # ═════════════════════════════════════════════════════════════

  trivy-fs:
    name: 4. quality - trivy fs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: paths
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') && (
        needs.paths.outputs.backend == 'true'
        || needs.paths.outputs.frontend == 'true'
        || needs.paths.outputs.ci == 'true'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy filesystem scan
        # aquasecurity/trivy-action@0.28.0
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload SARIF
        # github/codeql-action/upload-sarif@v3.27.0
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  audit-node:
    name: 4. quality - npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [paths, frontend-lint]
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') && (
        needs.paths.outputs.frontend == 'true'
        || needs.paths.outputs.ci == 'true'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  gitleaks:
    name: 4. quality - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: paths
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Direct binary install — avoids the gitleaks-action license gate
        # that fails for org accounts without GITLEAKS_LICENSE.
        # NOTE: 8.22+ is required for top-level [[allowlists]] syntax in
        # .gitleaks.toml; older versions silently ignore it and produce
        # false positives on already-handled paths.
        # Checksum verified via the release's own checksums.txt: a
        # release-account compromise would have to tamper with both the
        # binary AND the checksums file (same release tag), narrowing the
        # supply chain risk. For a stronger guarantee hardcode the SHA256
        # below instead of fetching it.
        # See .gstack/security-reports/2026-05-20-043200.json F8.
        run: |
          set -euo pipefail
          GL_VERSION=8.28.0
          GL_TARBALL="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          curl -sSL -o "$GL_TARBALL" "${BASE}/${GL_TARBALL}"
          curl -sSL -o gitleaks_checksums.txt "${BASE}/gitleaks_${GL_VERSION}_checksums.txt"
          grep " ${GL_TARBALL}\$" gitleaks_checksums.txt | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$GL_TARBALL" gitleaks
          rm -f "$GL_TARBALL" gitleaks_checksums.txt
          gitleaks version
      - name: Run gitleaks
        # exit-code 1 → fail the job on any finding;
        # --redact → don't print secrets in logs.
        run: gitleaks detect --source . --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif
      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 14

  # ═════════════════════════════════════════════════════════════
  # STAGE 5 — acceptance (main pushes only; runs the full stack)
  # ═════════════════════════════════════════════════════════════

  e2e:
    name: 5. acceptance - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [paths, images]
    # Without !cancelled() + failure-check, a SKIPPED `images` (doc-only push)
    # would cascade-skip this job. We still gate on main-push semantically.
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python
        with:
          install-test-deps: "true"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Generate .env
        run: bash scripts/setup/generate-env.sh
      - name: Provision GeoLite2 test fixtures (gitignored .mmdb)
        # The real GeoLite2 DBs are MaxMind-licensed and excluded by
        # .gitignore. Without them Angie aborts at startup on the
        # `geoip2 ... .mmdb` directives, which is what made the e2e
        # job time out on "Angie did not become reachable on :80".
        run: |
          mkdir -p configs/angie/geoip2
          base=https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data
          for f in GeoLite2-Country-Test.mmdb GeoLite2-City-Test.mmdb GeoLite2-ASN-Test.mmdb; do
            curl -sSfL "$base/$f" -o "configs/angie/geoip2/${f/-Test/}"
          done
          ls -la configs/angie/geoip2/
      - name: Start full stack
        id: stack-up
        # `--wait` blocks until every service reports healthy; if a service
        # has no healthcheck compose just waits for "started". `--wait-timeout`
        # caps the wait so a stuck service doesn't burn the whole job budget.
        run: docker compose up -d --build --wait --wait-timeout 300
        timeout-minutes: 12
      - name: Dump compose state on startup failure
        if: failure() && steps.stack-up.conclusion == 'failure'
        run: |
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          echo "::group::docker compose logs (last 400 lines)"
          docker compose logs --tail=400 || true
          echo "::endgroup::"
      - name: Wait for Angie to accept traffic
        run: |
          for i in $(seq 1 30); do
            if curl -sf --no-keepalive http://localhost:80/ > /dev/null 2>&1; then
              echo "WAF ready"; break
            fi
            echo "Attempt $i/30..."; sleep 5
            if [ "$i" -eq 30 ]; then
              echo "::error::Angie did not become reachable on :80 within 150s"
              docker compose logs --tail=200 angie || true
              exit 1
            fi
          done
      - name: Ensure modsec audit log exists
        run: |
          docker exec waf-angie-1 mkdir -p /var/log/angie || true
          docker exec waf-angie-1 touch /var/log/angie/modsec_audit.log || true
      - name: ModSecurity e2e suite
        id: e2e-waf
        continue-on-error: true
        run: |
          pytest -c tests/pyproject.toml -m e2e \
            tests/e2e/modsecurity/test_sqli_942.py \
            tests/e2e/modsecurity/test_xss_941.py \
            tests/e2e/modsecurity/test_lfi_930.py \
            -v --tb=short -x
      - name: Connections e2e suite
        id: e2e-conn
        continue-on-error: true
        run: pytest -c tests/pyproject.toml -m e2e tests/e2e/connections -v --tb=short
      - name: Collect docker logs on failure
        if: steps.e2e-waf.outcome == 'failure' || steps.e2e-conn.outcome == 'failure'
        run: docker compose logs --tail=300 > docker-logs.txt 2>&1
      - name: Upload docker logs
        if: steps.e2e-waf.outcome == 'failure' || steps.e2e-conn.outcome == 'failure'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: docker-logs-e2e
          path: docker-logs.txt
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose down -v

  loadtest:
    name: 5. acceptance - k6 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [paths, images]
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.paths.outputs.loadtest == 'true')
      )
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate .env
        run: bash scripts/setup/generate-env.sh
      - name: Provision GeoLite2 test fixtures (gitignored .mmdb)
        run: |
          mkdir -p configs/angie/geoip2
          base=https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data
          for f in GeoLite2-Country-Test.mmdb GeoLite2-City-Test.mmdb GeoLite2-ASN-Test.mmdb; do
            curl -sSfL "$base/$f" -o "configs/angie/geoip2/${f/-Test/}"
          done
      - name: Start angie + backend + postgres
        run: docker compose up -d --build --wait angie backend postgres
        timeout-minutes: 10
      - name: Wait for WAF
        run: |
          for i in $(seq 1 30); do
            if curl -sf --no-keepalive http://localhost:80/ > /dev/null 2>&1; then
              echo "WAF ready"; break
            fi
            echo "Attempt $i/30..."; sleep 5
          done
      - name: k6 smoke
        run: docker compose --profile loadtest run --rm k6 run /scripts/smoke.js
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ═════════════════════════════════════════════════════════════
  # Single required gate for branch protection.
  # Add `ci-required` to your protected-branch settings — that's it.
  # ═════════════════════════════════════════════════════════════
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs:
      - paths
      - frontend-lint
      - frontend-typecheck
      - workflow-lint
      - frontend-build
      - images
      - trivy-fs
      - audit-node
      - gitleaks
    steps:
      - name: Fail if any dependency failed
        run: |
          echo "Aggregated job results:"
          echo "  frontend-lint:       ${{ needs.frontend-lint.result }}"
          echo "  frontend-typecheck:  ${{ needs.frontend-typecheck.result }}"
          echo "  workflow-lint:       ${{ needs.workflow-lint.result }}"
          echo "  frontend-build:      ${{ needs.frontend-build.result }}"
          echo "  images:              ${{ needs.images.result }}"
          echo "  trivy-fs:            ${{ needs.trivy-fs.result }}"
          echo "  audit-node:          ${{ needs.audit-node.result }}"
          echo "  gitleaks:            ${{ needs.gitleaks.result }}"
          for r in \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-typecheck.result }}" \
            "${{ needs.workflow-lint.result }}" \
            "${{ needs.frontend-build.result }}" \
            "${{ needs.images.result }}" \
            "${{ needs.trivy-fs.result }}" \
            "${{ needs.audit-node.result }}" \
            "${{ needs.gitleaks.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Dependency failed with result=$r"; exit 1 ;;
            esac
          done
          echo "All required checks passed."
