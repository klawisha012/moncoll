name: waf

# ==============================================================================
# SECRETS
# Создать перед деплоем:
#   printf 'my_secure_password' | docker secret create clickhouse_password -
#   printf 'admin' | docker secret create grafana_admin_password -
# ==============================================================================
secrets:
  clickhouse_password:
    external: true
  grafana_admin_password:
    external: true

# ==============================================================================
# CONFIGS
# Создать перед деплоем:
#   docker config create angie_conf       ./etc/angie/angie.conf
#   docker config create angie_default    ./etc/angie/http.d/default.conf
#   docker config create modsecurity_conf ./etc/angie/modsecurity/modsecurity.conf
#   docker config create modsecurity_rules ./etc/angie/modsecurity/rules.conf
#   docker config create vector_yaml      ./etc/vector/vector.yaml
# ==============================================================================
configs:
  angie_conf:
    external: true
  angie_default:
    external: true
  modsecurity_conf:
    external: true
  modsecurity_rules:
    external: true
  vector_yaml:
    external: true

networks:
  waf_net:
    driver: overlay
    attachable: true

volumes:
  clickhouse_data:
    driver: local
  grafana_data:
    driver: local
  angie_logs:
    driver: local

services:

  # ----------------------------------------------------------------------------
  # Angie (WAF + Reverse Proxy)
  # ----------------------------------------------------------------------------
  angie:
    image: ${REGISTRY:-localhost:5000}/angie-modsec-crs:3.3.5
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    volumes:
      - angie_logs:/var/log/angie
      # GeoIP базы монтируем как bind-mount (должны быть на каждой ноде)
      - type: bind
        source: /opt/waf/geoip2
        target: /etc/angie/geoip2
    configs:
      - source: angie_conf
        target: /etc/angie/angie.conf
        mode: 0444
      - source: angie_default
        target: /etc/angie/http.d/default.conf
        mode: 0444
      - source: modsecurity_conf
        target: /etc/angie/modsecurity/modsecurity.conf
        mode: 0444
      - source: modsecurity_rules
        target: /etc/angie/modsecurity/rules.conf
        mode: 0444
    networks:
      - waf_net
    env_file:
      - ./envs/angie.env
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      labels:
        - "com.waf.service=angie"

  # ----------------------------------------------------------------------------
  # Vector (Log Shipper)
  # ----------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - angie_logs:/var/log/angie:ro
    configs:
      - source: vector_yaml
        target: /etc/vector/vector.yaml
        mode: 0444
    secrets:
      - clickhouse_password
    networks:
      - waf_net
    env_file:
      - ./envs/vector.env
    # Передаём пароль через env, vector.yaml читает его через переменную окружения
    environment:
      - CLICKHOUSE_PASSWORD_FILE=/run/secrets/clickhouse_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      labels:
        - "com.waf.service=vector"

  # ----------------------------------------------------------------------------
  # ClickHouse
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
        mode: ingress
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - type: bind
        source: /opt/waf/clickhouse/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
    secrets:
      - clickhouse_password
    networks:
      - waf_net
    env_file:
      - ./envs/clickhouse.env
    environment:
      - CLICKHOUSE_PASSWORD_FILE=/run/secrets/clickhouse_password
    deploy:
      replicas: 1
      # ClickHouse хранит состояние — фиксируем на конкретную ноду через label
      placement:
        constraints:
          - node.labels.clickhouse == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      labels:
        - "com.waf.service=clickhouse"

  # ----------------------------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: /opt/waf/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
    secrets:
      - grafana_admin_password
    networks:
      - waf_net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.grafana == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "com.waf.service=grafana"
