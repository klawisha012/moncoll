# GeoIP2 Configuration
# Load GeoIP2 databases
geoip2 /path/to/geoip2/GeoLite2-City.mmdb {
    auto_reload 60m;
    $geoip2_city_country_code country iso_code;
    $geoip2_city_country_name country names en;
    $geoip2_city_region_code subdivisions 0 iso_code;
    $geoip2_city_region_name subdivisions 0 names en;
    $geoip2_city_city_name city names en;
    $geoip2_city_latitude location latitude;
    $geoip2_city_longitude location longitude;
    $geoip2_city_postal_code postal code;
}

geoip2 /path/to/geoip2/GeoLite2-Country.mmdb {
    auto_reload 60m;
    $geoip2_country_code country iso_code;
    $geoip2_country_name country names en;
}

geoip2 /path/to/geoip2/GeoLite2-ASN.mmdb {
    auto_reload 60m;
    $geoip2_asn_number autonomous_system_number;
    $geoip2_asn_organization autonomous_system_organization;
}