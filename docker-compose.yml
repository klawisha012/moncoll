services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./var/log/crowdsec:/var/log/crowdsec
      - ./configs/crowdsec:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
    environment:
      - GID=1000
    restart: unless-stopped
    env_file:
      - .env

  angie:
    build: configs/angie
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC) — UDP
      - "443:443/udp"
    # Raise per-process file-descriptor ceiling so the worker can actually
    # use `worker_connections 65536`.
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
      nproc: 65535
    # Sysctls tuned for high-RPS / many short-lived connections.
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "1024 65535"
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./configs/angie/angie.conf:/etc/angie/angie.conf
      - ./configs/angie/http.d/:/etc/angie/http.d/
      - ./configs/angie/modsecurity/:/etc/angie/modsecurity/
      - ./configs/angie/geoip2/:/etc/angie/geoip2/
      - ./configs/angie/bouncers/:/etc/crowdsec/bouncers/
    depends_on:
      - vector
      - crowdsec
    # Healthcheck so `docker compose up --wait` blocks until Angie is
    # actually serving — without this, --wait only checks "started" and
    # CI can race past a crash-looping container.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/healthz >/dev/null || wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    env_file:
      - .env

  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - ./var/log:/var/log
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./configs/clickhouse/config.d:/etc/clickhouse-server/config.d
      - ./configs/clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml
      - clickhouse:/var/lib/clickhouse
    env_file:
      - .env
    environment:
      # Stop the entrypoint from auto-writing users.d/default-user.xml so our
      # bind-mounted version (generated by scripts/generate-env.sh) survives
      # restarts.
      - CLICKHOUSE_SKIP_USER_SETUP=1

  postgres:
    image: postgres:16-alpine
    # Password MUST come from .env (generated by scripts/generate-env.sh).
    # We removed the `:-waf` fallback: shipping with `waf:waf` lets any
    # process on the docker network dump the users table. See
    # .gstack/security-reports/2026-05-20-043200.json F3.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run scripts/generate-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-waf}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waf} -d ${POSTGRES_DB:-waf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    env_file:
      - .env

  # Cache layer for backend hot reads (CrowdSec decisions, ClickHouse aggregates,
  # GeoIP lookups, frontend session). Ephemeral — no AOF, LRU eviction.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    # Grants the non-root backend user access to /var/run/docker.sock by
    # joining the host's docker group at runtime. Override DOCKER_GID in
    # .env if your host's docker group GID differs from 999.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ./backend/src/:/app/src/
      - ./backend/alembic/:/app/alembic/
      - ./backend/alembic.ini:/app/alembic.ini
      - ./configs/angie/angie.conf:/app/etc/angie/angie.conf
      - ./configs/angie/http.d/:/var/lib/angie/http.d/
      # Persist user uploads (single index.html, static-site dirs, nginx config
      # dirs) across container recreations — without this they live in the
      # writable layer and disappear on `docker compose up` rebuilds.
      # Persist docker_compose connection project dirs across container
      # recreation. Without this the backend writes /var/lib/waf/compose
      # to the ephemeral writable layer, which disappears on rebuild and
      # leaves orphaned running compose stacks the backend can no longer
      # bring up/down (toggle returns 500: PermissionError on mkdir).
      - /var/run/docker.sock:/var/run/docker.sock
      - letsencrypt:/etc/letsencrypt
      - backend-data:/var/lib/angie/data
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-waf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run scripts/generate-env.sh}@postgres:5432/${POSTGRES_DB:-waf}
      # Public IPv4 of this WAF edge. The wizard surfaces this as the
      # A-record customers point their domain at, and the background
      # poller compares against it to detect DNS-flip. Override per
      # environment via .env.
      WAF_EDGE_IPV4: ${WAF_EDGE_IPV4:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)"
      - "--collector.textfile.directory=/etc/node-exporter"
    restart: unless-stopped

  blocked-ips-updater:
    image: alpine:latest
    command: sh -c "apk add --no-cache docker-cli bash jq && while true; do /scripts/update-blocked-ips.sh; sleep 15; done"
    depends_on:
      crowdsec:
        condition: service_started
        required: true
    environment:
      - COMPOSE_PROJECT_NAME=waf
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./scripts/update-blocked-ips.sh
        target: /scripts/update-blocked-ips.sh
      - type: bind
        source: ./configs/angie/http.d
        target: /configs/angie/http.d
      - /var/run/docker.sock:/var/run/docker.sock

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  # k6 load-testing harness. Run on-demand with:
  #   docker compose run --rm k6 run /scripts/baseline.js
  # Scripts live in tests/loadtest/k6 and target the angie service over the
  # internal Docker network (so we measure WAF throughput, not the host LB).
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./tests/loadtest/k6:/scripts:ro
    environment:
      - TARGET_HOST=${LOADTEST_TARGET_HOST:-angie}
      - TARGET_PORT=${LOADTEST_TARGET_PORT:-80}
      - TARGET_SCHEME=${LOADTEST_TARGET_SCHEME:-http}
      - K6_OUT=${K6_OUT:-}
    depends_on:
      - angie
    networks:
      default: null

  crowdsec-exporter:
    command: sh -c "pip install --root-user-action ignore requests pyyaml && python /app/crowdsec-alerts-exporter.py"
    depends_on:
      crowdsec:
        condition: service_started
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
    image: python:3-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./scripts/crowdsec-alerts-exporter.py
        target: /app/crowdsec-alerts-exporter.py
      - type: bind
        source: ./var/log/crowdsec
        target: /var/log/crowdsec
      - type: bind
        source: ./configs/crowdsec/local_api_credentials.yaml
        target: /etc/crowdsec/local_api_credentials.yaml
        read_only: true
    working_dir: /app

volumes:
  clickhouse:
  crowdsec-db:
  prometheus-storage:
  letsencrypt:
  backend-data:
  postgres-data:
  redis-data: