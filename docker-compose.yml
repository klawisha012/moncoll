name: waf
services:
  angie:
    image: angie-modsec-crs:3.3.5
    ports:
      - "80:80"
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./etc/angie/angie.conf:/etc/angie/angie.conf
      - ./etc/angie/http.d/:/etc/angie/http.d/
      - ./etc/angie/modsecurity/:/etc/angie/modsecurity/
      - ./etc/angie/geoip2/:/etc/angie/geoip2/
    depends_on:
      - vector
    restart: unless-stopped
    env_file:
      - .env

  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - ./var/log:/var/log
      - ./etc/vector/vector.yaml:/etc/vector/vector.yaml
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse:/var/lib/clickhouse
    env_file:
      - .env

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
    #   - ./etc/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./etc/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      - clickhouse
    restart: unless-stopped
    environment:
    #   - GF_SECURITY_ADMIN_PASSWORD=admin
    #   - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource

volumes:
  clickhouse:
  grafana-storage: