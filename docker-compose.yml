services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./var/log/crowdsec:/var/log/crowdsec
      - ./configs/crowdsec:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
    environment:
      - GID=1000
    restart: unless-stopped
    env_file:
      - .env

  angie:
    build: configs/angie
    ports:
      - "80:80"
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./configs/angie/angie.conf:/etc/angie/angie.conf
      - ./configs/angie/bouncer.conf:/etc/angie/bouncer.conf
      - ./configs/angie/blocked_ips.conf:/etc/angie/blocked_ips.conf
      - ./configs/angie/http.d/:/etc/angie/http.d/
      - ./configs/angie/http.d/acme/:/var/lib/angie/acme/
      - ./configs/angie/modsecurity/:/etc/angie/modsecurity/
      - ./configs/angie/geoip2/:/etc/angie/geoip2/
    depends_on:
      - vector
      - crowdsec
    restart: unless-stopped
    env_file:
      - .env

  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - ./var/log:/var/log
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse:/var/lib/clickhouse
    env_file:
      - .env

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./configs/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-clickhouse-datasource
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - GF_PROVISIONING_ENABLED=true
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./configs/angie/connections.json:/var/lib/angie/connections.json
      - ./configs/angie/http.d/:/var/lib/angie/http.d/
      - ./configs/angie/http.d/acme/:/var/lib/angie/acme/
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)"
      - "--collector.textfile.directory=/etc/node-exporter"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  crowdsec-exporter:
    command: sh -c "pip install requests pyyaml && python /app/crowdsec-alerts-exporter.py"
    depends_on:
      crowdsec:
        condition: service_started
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
    image: python:3-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: C:\Sync\Programming\projects\waf\scripts\crowdsec-alerts-exporter.py
        target: /app/crowdsec-alerts-exporter.py
        bind:
          create_host_path: true
      - type: bind
        source: C:\Sync\Programming\projects\waf\var\log\crowdsec
        target: /var/log/crowdsec
        bind:
          create_host_path: true
      - type: bind
        source: C:\Sync\Programming\projects\waf\configs\crowdsec\local_api_credentials.yaml
        target: /etc/crowdsec/local_api_credentials.yaml
        read_only: true
    working_dir: /app

volumes:
  clickhouse:
  grafana-storage:
  crowdsec-db:
  prometheus-storage: