services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./var/log/crowdsec:/var/log/crowdsec
      - ./configs/crowdsec:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
    environment:
      - GID=1000
    restart: unless-stopped
    env_file:
      - .env

  angie:
    build: configs/angie
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./configs/angie/angie.conf:/etc/angie/angie.conf
      - ./configs/angie/http.d/:/etc/angie/http.d/
      - ./configs/angie/modsecurity/:/etc/angie/modsecurity/
      - ./configs/angie/geoip2/:/etc/angie/geoip2/
    depends_on:
      - vector
      - crowdsec
    restart: unless-stopped
    env_file:
      - .env

  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - ./var/log:/var/log
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse:/var/lib/clickhouse
    env_file:
      - .env

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./configs/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-logs}
      - GF_PROVISIONING_ENABLED=true
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_LIVE_ALLOWED_ORIGINS=*

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waf}
      POSTGRES_DB: ${POSTGRES_DB:-waf}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waf} -d ${POSTGRES_DB:-waf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    env_file:
      - .env

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src/:/app/src/
      - ./backend/alembic/:/app/alembic/
      - ./backend/alembic.ini:/app/alembic.ini
      - ./configs/angie/angie.conf:/app/etc/angie/angie.conf
      - ./configs/angie/http.d/:/var/lib/angie/http.d/
      - ./examples/:/app/site-templates/examples/:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - letsencrypt:/etc/letsencrypt
      - backend-data:/var/lib/angie/data
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-waf}:${POSTGRES_PASSWORD:-waf}@postgres:5432/${POSTGRES_DB:-waf}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)"
      - "--collector.textfile.directory=/etc/node-exporter"
    restart: unless-stopped

  blocked-ips-updater:
    image: alpine:latest
    command: sh -c "apk add --no-cache docker-cli bash jq && while true; do /scripts/update-blocked-ips.sh; sleep 15; done"
    depends_on:
      crowdsec:
        condition: service_started
        required: true
    environment:
      - COMPOSE_PROJECT_NAME=waf
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./scripts/update-blocked-ips.sh
        target: /scripts/update-blocked-ips.sh
      - type: bind
        source: ./configs/angie/http.d
        target: /configs/angie/http.d
      - /var/run/docker.sock:/var/run/docker.sock

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  crowdsec-exporter:
    command: sh -c "pip install --root-user-action ignore requests pyyaml && python /app/crowdsec-alerts-exporter.py"
    depends_on:
      crowdsec:
        condition: service_started
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
    image: python:3-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./scripts/crowdsec-alerts-exporter.py
        target: /app/crowdsec-alerts-exporter.py
      - type: bind
        source: ./var/log/crowdsec
        target: /var/log/crowdsec
      - type: bind
        source: ./configs/crowdsec/local_api_credentials.yaml
        target: /etc/crowdsec/local_api_credentials.yaml
        read_only: true
    working_dir: /app

volumes:
  clickhouse:
  grafana-storage:
  crowdsec-db:
  prometheus-storage:
  letsencrypt:
  backend-data:
  postgres-data: