services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./var/log/crowdsec:/var/log/crowdsec
      - ./configs/crowdsec:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
    environment:
      - GID=1000
    restart: unless-stopped
    env_file:
      - .env

  angie:
    build: configs/angie
    ports:
      - "80:80"
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./configs/angie/angie.conf:/etc/angie/angie.conf
      - ./configs/angie/bouncer.conf:/etc/angie/bouncer.conf
      - ./configs/angie/blocked_ips.conf:/etc/angie/blocked_ips.conf
      - ./configs/angie/http.d/:/etc/angie/http.d/
      - ./configs/angie/connections.d/:/etc/angie/connections.d/
      - ./configs/angie/modsecurity/:/etc/angie/modsecurity/
      - ./configs/angie/geoip2/:/etc/angie/geoip2/
    depends_on:
      - vector
      - crowdsec
    restart: unless-stopped
    env_file:
      - .env

  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - ./var/log:/var/log
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse:/var/lib/clickhouse
    env_file:
      - .env

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      # Mount custom Grafana configuration to serve from sub‑path
      - ./configs/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-clickhouse-datasource
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - GF_PROVISIONING_ENABLED=true
      # Serve Grafana under the /grafana sub‑path so it generates correct asset URLs
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./configs/angie/modsecurity:/app/etc/angie/modsecurity
      - ./configs/angie/angie.conf:/app/etc/angie/angie.conf
      - ./configs/angie/connections.json:/app/etc/angie/connections.json
      - ./configs/angie/connections.d/:/app/etc/angie/connections.d/
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - .env

  crowdsec-exporter:
    command: sh -c "pip install requests pyyaml && python /app/crowdsec-alerts-exporter.py"
    depends_on:
      crowdsec:
        condition: service_started
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
    image: python:3-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: C:\Sync\Programming\projects\waf\scripts\crowdsec-alerts-exporter.py
        target: /app/crowdsec-alerts-exporter.py
        bind:
          create_host_path: true
      - type: bind
        source: C:\Sync\Programming\projects\waf\var\log\crowdsec
        target: /var/log/crowdsec
        bind:
          create_host_path: true
      - type: bind
        source: C:\Sync\Programming\projects\waf\configs\crowdsec\local_api_credentials.yaml
        target: /etc/crowdsec/local_api_credentials.yaml
        read_only: true
    working_dir: /app

volumes:
  clickhouse:
  grafana-storage:
  crowdsec-db:
