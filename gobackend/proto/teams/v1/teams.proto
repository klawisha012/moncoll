syntax = "proto3";

package teams.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service TeamsService {
  // GET /api/teams — teams the caller belongs to.
  rpc ListMyTeams(ListMyTeamsRequest) returns (ListMyTeamsResponse) {
    option (google.api.http) = {get: "/api/teams"};
  }

  // POST /api/teams/switch — set the caller's active team.
  rpc SwitchTeam(SwitchTeamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/teams/switch"
      body: "*"
    };
  }

  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {get: "/api/teams/invitations"};
  }
  rpc CreateInvitation(CreateInvitationRequest) returns (Invitation) {
    option (google.api.http) = {post: "/api/teams/invitations" body: "*"};
  }
  // PreviewInvitation is public (no session): given a raw token it returns the
  // team name, role and invited email so the accept page can show what the user
  // is joining before they sign in. The token is the bearer secret, so revealing
  // these details to its holder is acceptable.
  rpc PreviewInvitation(PreviewInvitationRequest) returns (InvitationPreview) {
    option (google.api.http) = {get: "/api/teams/invitations/preview"};
  }
  rpc AcceptInvitation(AcceptInvitationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/invitations/accept" body: "*"};
  }
  rpc AcceptInvitationById(InvitationIdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/invitations/accept-by-id" body: "*"};
  }
  rpc DeclineInvitation(InvitationIdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/invitations/decline" body: "*"};
  }
  rpc RevokeInvitation(InvitationIdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/invitations/revoke" body: "*"};
  }
  rpc ResendInvitation(InvitationIdRequest) returns (Invitation) {
    option (google.api.http) = {post: "/api/teams/invitations/resend" body: "*"};
  }

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/api/teams/members"};
  }
  rpc RemoveMember(MemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/members/remove" body: "*"};
  }
  rpc ChangeRole(ChangeRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/members/role" body: "*"};
  }
  // RenameTeam changes the active team's display_name (owner only). The slug
  // (tenants.name) is identity and is never touched.
  rpc RenameTeam(RenameTeamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/rename" body: "*"};
  }
  rpc LeaveTeam(LeaveTeamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/teams/leave" body: "*"};
  }

  // LookupUserByEmail resolves an EXACT email to a platform user, for admins
  // composing an invitation. Admin-only; exact match only (no enumeration).
  rpc LookupUserByEmail(LookupUserByEmailRequest) returns (UserLookupResponse) {
    option (google.api.http) = {get: "/api/teams/users/lookup"};
  }
}

message ListMyTeamsRequest {}

message Team {
  int64 tenant_id = 1;
  string slug = 2;
  string display_name = 3;
  string role = 4;
  bool active = 5;
}

message ListMyTeamsResponse {
  repeated Team teams = 1;
}

message SwitchTeamRequest {
  int64 tenant_id = 1;
}

message Invitation {
  int64 id = 1;
  int64 tenant_id = 2;
  string email = 3;
  string role = 4;
  string status = 5;
  string team_name = 6;
  string expires_at = 7;
  // accept_url is the full invite link with the raw token. It is only
  // populated in CreateInvitation/ResendInvitation responses (the single
  // moment the raw token exists) so an admin can share the link manually
  // when email delivery is unavailable. Never set in ListInvitations.
  string accept_url = 8;
  // email_sent reports whether the invitation email was actually delivered
  // to the SMTP server. Only meaningful in CreateInvitation/ResendInvitation
  // responses; false when SMTP is unconfigured or sending failed.
  bool email_sent = 9;
}
message CreateInvitationRequest {
  string email = 1;
  string role = 2;
}
message ListInvitationsRequest {}
message ListInvitationsResponse {
  repeated Invitation outgoing = 1;
  repeated Invitation incoming = 2;
}
message AcceptInvitationRequest {
  string token = 1;
}
message PreviewInvitationRequest {
  string token = 1;
}
message InvitationPreview {
  bool valid = 1; // false when the token is unknown, expired, or already used
  string team_name = 2;
  string role = 3;
  string email = 4;
  // account_exists is true when a user with `email` already exists. The accept
  // page uses it to decide between an inline create-password form (no account)
  // and a sign-in prompt (account exists). Only meaningful when valid=true.
  bool account_exists = 5;
}
message InvitationIdRequest {
  int64 id = 1;
}

message Member {
  int64 user_id = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
}
message ListMembersRequest {}
message ListMembersResponse {
  repeated Member members = 1;
  string my_role = 2;
  string team_name = 3;
}
message MemberRequest {
  int64 user_id = 1;
}
message ChangeRoleRequest {
  int64 user_id = 1;
  string role = 2;
}
message RenameTeamRequest {
  string display_name = 1;
}
message LeaveTeamRequest {}

message LookupUserByEmailRequest {
  string email = 1;
}
message UserLookupResponse {
  bool found = 1;
  int64 user_id = 2;
  string email = 3;
  string display_name = 4;
  bool already_member = 5; // true if that user is already in the caller's active team
}
