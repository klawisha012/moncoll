server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =============================================
    # 1. Прокси для Grafana UI
    # =============================================
    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # =============================================
    # 2. Прокси для Connections API
    # =============================================
    # Redirect /api/connections -> /api/connections/
    location = /api/connections {
        return 301 /api/connections/;
    }

    location ^~ /api/connections/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 3. Прокси для Dashboard API
    # =============================================
    location ^~ /api/dashboard/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/api/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

     # =============================================
     # 4. Прокси для ModSecurity API
     # =============================================
     location ^~ /api/modsecurity/ {
         if ($request_method = OPTIONS) {
             add_header Access-Control-Allow-Origin "*";
             add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
             add_header Access-Control-Allow-Headers "*";
             add_header Content-Length 0;
             return 204;
         }
         proxy_pass http://backend:8000/api/modsecurity/;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
     }

     # =============================================
     # 5. Прокси для SSL Certificates API
     # =============================================
     location ^~ /api/ssl/ {
         if ($request_method = OPTIONS) {
             add_header Access-Control-Allow-Origin "*";
             add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
             add_header Access-Control-Allow-Headers "*";
             add_header Content-Length 0;
             return 204;
         }
         proxy_pass http://backend:8000/api/ssl/;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
     }

     # =============================================
     # 6. Прокси для Angie API
     # =============================================
location ^~ /api/angie/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/api/angie/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 7. Proxy for Monitoring API
    # =============================================
     location ^~ /api/monitoring/ {
         if ($request_method = OPTIONS) {
             add_header Access-Control-Allow-Origin "*";
             add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
             add_header Access-Control-Allow-Headers "*";
             add_header Content-Length 0;
             return 204;
         }
         proxy_pass http://backend:8000/api/monitoring/;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
     }

     # =============================================
     # 8. Proxy for CrowdSec API
     # =============================================
     location ^~ /api/crowdsec/ {
         if ($request_method = OPTIONS) {
             add_header Access-Control-Allow-Origin "*";
             add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
             add_header Access-Control-Allow-Headers "*";
             add_header Content-Length 0;
             return 204;
         }
         proxy_pass http://backend:8000/api/crowdsec/;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
     }

     # Proxy for Prometheus metrics endpoint
     location = /metrics {
         proxy_pass http://backend:8000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
     }

     # =============================================
     # 5. Редирект trailing slash для SPA (React)
    #    Исключаем все API пути
    # =============================================
    location ~ ^(?!/grafana/|/api/)(/.+)/$ {
        return 301 $1;
    }

    # =============================================
    # 6. React SPA — все остальные пути (включая /connections)
    # =============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =============================================
    # 7. Кэширование статики
    # =============================================
    # Favicon — short cache (1h) so updates appear quickly
    location = /favicon.png {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
