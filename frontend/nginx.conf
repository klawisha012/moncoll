server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =============================================
    # 1. Прокси для Grafana UI
    # =============================================
    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 2. Прокси для Connections API (только с trailing slash)
    # =============================================
    location ^~ /api/connections/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/api/connections/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 3. Прокси для Dashboard API
    # =============================================
    location ^~ /api/dashboard/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/api/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 4. Прокси для ModSecurity API
    # =============================================
    location ^~ /api/modsecurity/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/api/modsecurity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 5. Прокси для Angie API
    # =============================================
    location ^~ /api/angie/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/api/angie/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 5. Редирект trailing slash для SPA (React)
    #    Исключаем все API пути
    # =============================================
    location ~ ^(?!/grafana/|/api/)(/.+)/$ {
        return 301 $1;
    }

    # =============================================
    # 6. React SPA — все остальные пути (включая /connections)
    # =============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =============================================
    # 7. Кэширование статики
    # =============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
