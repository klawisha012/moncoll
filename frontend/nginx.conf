server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =============================================
    # 1. Прокси для Grafana UI
    # =============================================
    # The original configuration used a trailing slash in `proxy_pass`, which caused
    # Nginx to strip the `/dashboard/` prefix and forward the request to the Grafana
    # root (`http://grafana:3000/`). Grafana then redirects back to `/dashboard/`,
    # creating an infinite 301 loop. Removing the trailing slash preserves the
    # original request path, so `/dashboard/` is proxied to `http://grafana:3000/dashboard/`
    # and the redirect loop is eliminated.
    # Exact match without trailing slash – redirect to the slash version.
    location = /dashboard {
        return 301 /dashboard/;
    }

    # Proxy all requests under /dashboard/ to Grafana.
    # proxy_pass without a trailing slash preserves the full original request URI,
    # so /dashboard/login is forwarded as /dashboard/login. Grafana with
    # serve_from_sub_path=true expects the subpath in the request.
    location ^~ /dashboard/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # =============================================
    # 2. Редирект trailing slash ТОЛЬКО для SPA-фронтенда (React)
    #    НЕ трогаем /dashboard и /modsecurity
    # =============================================
    location ~ ^(?!/dashboard|/modsecurity)(/.+)/$ {
        return 301 $1;
    }

    # =============================================
    # 3. Прокси для ModSecurity API
    # =============================================
    # The trailing slash in both the location and the proxy_pass ensures that the
    # full original URI (`/modsecurity/...`) is forwarded to the backend, e.g.
    # `/modsecurity/settings` → `http://backend:8000/modsecurity/settings`.
    location /modsecurity/ {
        # Handle CORS preflight requests.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/modsecurity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 4. Прокси для Angie API
    # =============================================
    location /angie/ {
        # CORS preflight handling for the Angie API.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://backend:8000/angie/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =============================================
    # 4. React SPA (фронтенд) — все остальные пути
    # =============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =============================================
    # 5. Кэширование статики
    # =============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
