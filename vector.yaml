sources:
  angie_logs:
    type: file
    include:
      - /var/log/angie/access.log

transforms:
  parse_logs:
    type: remap
    inputs:
      - angie_logs
    source: |
      del(.timestamp)
      .message = .message

sinks:
  print_sink:
    type: console
    inputs:
      - parse_logs
    encoding:
      codec: json

  clickhouse_sink:
    type: clickhouse
    inputs:
      - parse_logs
    endpoint: "http://clickhouse:8123"
    database: default
    table: access_logs
    format: json_each_row
    compression: gzip
    auth:
      strategy: basic
      user: default
      password: "my_secure_password"
    batch:
      max_events: 1000
      timeout_secs: 1
    acknowledgements:
      enabled: true