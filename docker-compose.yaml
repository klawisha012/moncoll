services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    environment:
      CONTAINERS: 1
      EXEC: 1
      INFO: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./var/log/crowdsec:/var/log/crowdsec
      - ./docker/crowdsec:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
    environment:
      - GID=1000
    restart: unless-stopped
    env_file:
      - .env

  angie:
    build: docker/angie
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    # Raise per-process file-descriptor ceiling so the worker can actually
    # use `worker_connections 65536`.
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
      nproc: 65535
    # Sysctls tuned for high-RPS / many short-lived connections.
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "1024 65535"
    volumes:
      - ./var/log/angie:/var/log/angie
      - ./docker/angie/angie.conf:/etc/angie/angie.conf
      - ./docker/angie/http.d/:/etc/angie/http.d/
      - ./docker/angie/modsecurity/:/etc/angie/modsecurity/
      - ./docker/angie/geoip2/:/etc/angie/geoip2/
      - ./docker/angie/bouncers/:/etc/crowdsec/bouncers/
      # Per-tenant connection configs written by the backend (Phase 13).
      # Mounted read-only so the glob include /etc/angie/tenants/*/compose/...
      # in angie.conf picks up active tenant configs. Suspended tenants have
      # their compose/ dir renamed to compose.suspended/ so they're excluded.
      - waf-tenants:/etc/angie/tenants:ro
      - angie-run:/run/angie
    depends_on:
      - vector
      - crowdsec
      # OTel collector must exist before Angie boots so ngx_otel_module can
      # reach otel-collector:4317 (module retries, but keeps startup logs clean).
      - otel-collector
      # Angie resolves the `centrifugo`/`frontend` upstream hostnames at
      # config-parse time (literal proxy_pass targets in waf-admin.conf).
      # Without start ordering it can boot before their DNS exists and
      # crash-loop on `host not found in upstream "centrifugo"`.
      - centrifugo
      - frontend
    # Healthcheck so `docker compose up --wait` blocks until Angie is
    # actually serving — without this, --wait only checks "started" and
    # CI can race past a crash-looping container.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/healthz >/dev/null || wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    env_file:
      - .env

  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - ./var/log:/var/log
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml
    depends_on:
      - clickhouse
    restart: unless-stopped
    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:26.5
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/clickhouse/config.d:/etc/clickhouse-server/config.d
      - ./docker/clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml
      - clickhouse:/var/lib/clickhouse
    env_file:
      - .env
    environment:
      # Stop the entrypoint from auto-writing users.d/default-user.xml so our
      # bind-mounted version (generated by scripts/generate-env.sh) survives
      # restarts.
      - CLICKHOUSE_SKIP_USER_SETUP=1

  postgres:
    image: postgres:16.9-alpine
    # Password MUST come from .env (generated by scripts/generate-env.sh).
    # We removed the `:-waf` fallback: shipping with `waf:waf` lets any
    # process on the docker network dump the users table. See
    # .gstack/security-reports/2026-05-20-043200.json F3.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run scripts/generate-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-waf}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waf} -d ${POSTGRES_DB:-waf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    env_file:
      - .env

  # Real-time fan-out for dashboard updates. Backend publishes aggregated
  # geoip/events deltas via HTTP API; Centrifugo holds persistent WS/SSE
  # connections to browser clients. Uses redis engine for HA-readiness
  # (same Redis instance as Vector→backend pub/sub).
  centrifugo:
    image: centrifugo/centrifugo:v6.7.0
    command: centrifugo --config=/centrifugo/config.json
    ports:
      - "8001:8000"
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      # Env-var override: Centrifugo maps each config key path to
      # CENTRIFUGO_<UPPER_KEY_PATH> by joining with `_`. JSON has the
      # structural config; secrets live only in .env.
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET missing - run scripts/generate-env.sh}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY missing - run scripts/generate-env.sh}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Cache layer for backend hot reads (CrowdSec decisions, ClickHouse aggregates,
  # GeoIP lookups, frontend session). Ephemeral — no AOF, LRU eviction.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --io-threads
      - "4"
      - --tcp-backlog
      - "65535"
      - --loglevel
      - "warning"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Go backend — sole API server (the Python `backend` service was removed in
  # the final strangler cutover; its source remains under ./backend for
  # reference/rollback). Serves all /api/* modules on :8080 via grpc-gateway,
  # Prometheus metrics on :9100, and runs DB migrations on startup
  # (internal/migrate, unless WAF_SKIP_MIGRATE=1).
  # NOTE: set WAF_PASETO_KEY in .env so this service can read its session key —
  # the mounted .paseto_key file may be unreadable to this container's
  # non-root uid.
  gobackend:
    build: ./gobackend
    expose:
      # 8080 = grpc-gateway REST (proxied by frontend nginx for /api/*).
      - "8080"
      # 9100 = Prometheus app metrics (scraped by prometheus, proxied at /metrics).
      - "9100"
    # Run as the same uid (1000) the Python backend uses: that backend owns the
    # waf-tenants tree (chown -R app:app /var/lib/waf). Admin suspend/delete
    # rename/rmtree under /var/lib/waf/tenants, so gobackend must share that
    # ownership or those writes hit EACCES.
    user: "1000:1000"
    group_add:
      - "0"
    environment:
      WAF_POSTGRES_DSN: postgres://${POSTGRES_USER:-waf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run scripts/generate-env.sh}@postgres:5432/${POSTGRES_DB:-waf}?sslmode=disable
      WAF_PASETO_KEY: ${WAF_PASETO_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ClickHouse connection (mirrors Python backend env vars exactly).
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT:-http://clickhouse:8123}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD missing - run scripts/generate-env.sh}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logs}
      # Redis for ClickHouse query result cache (same instance as backend).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DASHBOARD_QUERY_TTL: ${DASHBOARD_QUERY_TTL:-2}
      # Connections: WAF edge IPv4 (used by DNS verify + edge-info endpoint).
      WAF_EDGE_IPV4: ${WAF_EDGE_IPV4:-}
      # Per-tenant CNAME edge base (clients CNAME to <slug>.<this>). When set,
      # takes priority over WAF_EDGE_IPV4. Operator must point its A records
      # (or a wildcard) at the edge node(s).
      WAF_EDGE_HOSTNAME_BASE: ${WAF_EDGE_HOSTNAME_BASE:-}
      # Optional public-IP echo endpoint used only when neither base nor
      # WAF_EDGE_IPV4 is set (dev behind NAT). Default: https://api.ipify.org
      WAF_EDGE_ECHO_URL: ${WAF_EDGE_ECHO_URL:-}
      # ACME email for Let's Encrypt certificate requests.
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      # Connections poller tick interval (seconds; default 60).
      WAF_POLLER_TICK_SECONDS: ${WAF_POLLER_TICK_SECONDS:-60}
      # Public DNS resolvers for ownership verification (comma-separated,
      # bare IP or host:port). Routes _waf-verify TXT / A lookups straight to
      # these instead of the container's local resolver, which can negatively
      # cache the record (queried before the operator publishes it) and then
      # keep returning "not found" long after public DNS checkers see it.
      # Empty → fall back to the container's default resolver.
      WAF_DNS_SERVERS: ${WAF_DNS_SERVERS:-1.1.1.1,8.8.8.8}
      # crowdsec container name for `cscli` docker-exec. Default is the
      # docker-compose v2 name (hyphens); override to the v1 name
      # (waf_crowdsec_1) on hosts running docker-compose v1.
      WAF_CROWDSEC_CONTAINER: ${WAF_CROWDSEC_CONTAINER:-waf-crowdsec-1}
      # angie container name for `angie -t` config validation via docker-exec.
      # Same v2/v1 naming caveat as WAF_CROWDSEC_CONTAINER above.
      WAF_ANGIE_CONTAINER: ${WAF_ANGIE_CONTAINER:-waf-angie-1}
      # ── Realtime / Centrifugo (mirrors Python backend env block) ────────────
      CENTRIFUGO_API_URL: ${CENTRIFUGO_API_URL:-http://centrifugo:8000/api}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY missing - run scripts/generate-env.sh}
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET missing - run scripts/generate-env.sh}
      # Redis pub/sub channel where Vector pushes raw attack events.
      REDIS_RAW_CHANNEL: ${REDIS_RAW_CHANNEL:-attacks:raw}
      # ── Auth service (mirrors the Python backend's auth env block) ──────────
      WAF_PUBLIC_BASE_URL: ${WAF_PUBLIC_BASE_URL:-}
      WAF_COOKIE_SECURE: ${WAF_COOKIE_SECURE:-false}
      # Session lifetime in hours: PASETO token exp + cookie Max-Age.
      # Empty = gobackend default (7 days — defaultSessionTTL in internal/auth/issuance.go).
      WAF_SESSION_TTL_HOURS: ${WAF_SESSION_TTL_HOURS:-}
      WAF_TURNSTILE_SITE_KEY: ${WAF_TURNSTILE_SITE_KEY:-}
      WAF_TURNSTILE_SECRET_KEY: ${WAF_TURNSTILE_SECRET_KEY:-}
      WAF_SMTP_HOST: ${WAF_SMTP_HOST:-}
      WAF_SMTP_PORT: ${WAF_SMTP_PORT:-587}
      WAF_SMTP_USERNAME: ${WAF_SMTP_USERNAME:-}
      WAF_SMTP_PASSWORD: ${WAF_SMTP_PASSWORD:-}
      WAF_SMTP_FROM_EMAIL: ${WAF_SMTP_FROM_EMAIL:-}
      WAF_SMTP_FROM_NAME: ${WAF_SMTP_FROM_NAME:-}
      WAF_SMTP_STARTTLS: ${WAF_SMTP_STARTTLS:-true}
      WAF_OAUTH_GOOGLE_CLIENT_ID: ${WAF_OAUTH_GOOGLE_CLIENT_ID:-}
      WAF_OAUTH_GOOGLE_CLIENT_SECRET: ${WAF_OAUTH_GOOGLE_CLIENT_SECRET:-}
      WAF_OAUTH_GOOGLE_REDIRECT_URI: ${WAF_OAUTH_GOOGLE_REDIRECT_URI:-}
      WAF_OAUTH_GITHUB_CLIENT_ID: ${WAF_OAUTH_GITHUB_CLIENT_ID:-}
      WAF_OAUTH_GITHUB_CLIENT_SECRET: ${WAF_OAUTH_GITHUB_CLIENT_SECRET:-}
      WAF_OAUTH_GITHUB_REDIRECT_URI: ${WAF_OAUTH_GITHUB_REDIRECT_URI:-}
      # ── OpenTelemetry tracing ───────────────────────────────────────────────
      # Setting an endpoint TURNS ON the already-wired tracer (internal/
      # observability): HTTP server spans + pgx query spans → otel-collector →
      # ClickHouse. Empty endpoint = off (NeverSample), no external dependency.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-waf-gobackend}
      # Narrow Docker API proxy for monitoring and cscli/Angie exec; the app
      # container does not receive the raw daemon socket.
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      # backend-data is mounted read-write so the crowdsec sync loop can write
      # connections.json and blocked_ips_mapping.json under /var/lib/angie/data.
      # (Python backend also writes here; both share the same named volume.)
      - backend-data:/var/lib/angie/data
      - waf-tenants:/var/lib/waf/tenants
      - ./docker/angie/modsecurity/:/app/etc/angie/modsecurity/
      # SSL: Let's Encrypt cert store (shared with backend for ACME issuance).
      - letsencrypt:/etc/letsencrypt
      # SSL: http.d bind-mount for non-tenant cert file writes (same path as backend).
      - ./docker/angie/http.d/:/var/lib/angie/http.d/
    depends_on:
      # Migrations run on startup against postgres → must be healthy first.
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      # Redis has a healthcheck (used for CH query cache + realtime pub/sub).
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
      docker-proxy:
        condition: service_started
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - gobackend
    restart: unless-stopped
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:v3.12.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/rules/:/etc/prometheus/rules/
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.11.1
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)"
      - "--collector.textfile.directory=/etc/node-exporter"
    restart: unless-stopped

  # NOTE: the old `blocked-ips-updater` sidecar was removed. CrowdSec ban sync
  # is now done in-process by the backend (run_blocked_ips_sync_forever in
  # crowdsec/service.py), which routes bans per-connection instead of copying
  # the full list onto every domain.

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    # NOTE: the previous `/var/lib/docker:/var/lib/docker:ro` bind mount was
    # removed. On VM-backed daemons (Docker Desktop) that path doesn't exist
    # inside the VM and the daemon can't create it on the read-only rootfs,
    # which crashed `compose up`. cAdvisor still works without it (only per-image
    # layer disk stats are lost). /dev/kmsg gives it kernel event access.
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped

  # ── OpenTelemetry tracing ────────────────────────────────────────────────
  # Collector: единая точка приёма трасс (OTLP gRPC :4317 от angie, HTTP :4318
  # от backend и браузера). Экспорт в ClickHouse (БД otel, авто-создаётся).
  # ponytail: :latest как у minio ниже — закрепить датированный тег при
  # прод-хардненинге.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
    ports:
      # Loopback-only, для отладки/прямой отправки трасс с хоста.
      - "127.0.0.1:4318:4318"
    depends_on:
      clickhouse:
        condition: service_started
    restart: unless-stopped
    env_file:
      - .env

  # Grafana — просмотр трасс (Explore → Traces, datasource ClickHouse
  # провижинится из docker/grafana/provisioning). Анонимный Viewer включён для
  # dev (loopback-bound); пароль admin берётся из .env или дефолт.
  # ponytail: :latest — закрепить тег в проде; anon-viewer выключить.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - clickhouse
      - otel-collector
    restart: unless-stopped
    env_file:
      - .env

  # Инструмент нагрузочного тестирования wrk. Запускается по запросу:
  #   docker compose run --rm wrk -t 32 -c 128 -d 30s -s /scripts/smoke.lua http://angie/
  # Скрипты находятся в tests/loadtest/wrk.
  wrk:
    image: skandyla/wrk:4.1.0
    profiles: ["loadtest"]
    volumes:
      - ./tests/loadtest/wrk:/scripts:ro
    depends_on:
      - angie
    networks:
      default: null


  crowdsec-exporter:
    command: sh -c "pip install --root-user-action ignore requests pyyaml && python /app/crowdsec-alerts-exporter.py"
    depends_on:
      crowdsec:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
    image: python:3.12-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./scripts/exporters/crowdsec-alerts-exporter.py
        target: /app/crowdsec-alerts-exporter.py
      - type: bind
        source: ./var/log/crowdsec
        target: /var/log/crowdsec
      - type: bind
        source: ./docker/crowdsec
        target: /etc/crowdsec
        read_only: true
    working_dir: /app

  # ── S3 source of truth for horizontal scaling (profile: s3) ───────────────
  # MinIO is the shared state store when WAF_STORAGE_BACKEND=s3: backend writes
  # per-tenant config/certs/bans here, each edge-sync sidecar pulls from here.
  # Off by default — only starts with `docker compose --profile s3 up`.
  # ponytail: pin a dated RELEASE tag in prod hardening (tasks T032).
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Dev defaults; scripts/setup/generate-env.sh writes strong creds.
      # MinIO is profile-gated + loopback-bound, so blast radius is small — but
      # NEVER ship these defaults to prod (set WAF_S3_ROOT_* in .env).
      MINIO_ROOT_USER: ${WAF_S3_ROOT_USER:-waf-minio}
      MINIO_ROOT_PASSWORD: ${WAF_S3_ROOT_PASSWORD:-changeme-dev-only}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: bucket + scoped users (backend RW, edge-sync RO). Exits 0.
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      WAF_S3_BUCKET: ${WAF_S3_BUCKET:-waf-state}
      WAF_S3_ROOT_USER: ${WAF_S3_ROOT_USER:-waf-minio}
      WAF_S3_ROOT_PASSWORD: ${WAF_S3_ROOT_PASSWORD:-changeme-dev-only}
      WAF_S3_ACCESS_KEY: ${WAF_S3_ACCESS_KEY:-waf-backend}
      WAF_S3_SECRET_KEY: ${WAF_S3_SECRET_KEY:-changeme-backend-dev}
      WAF_S3_EDGE_ACCESS_KEY: ${WAF_S3_EDGE_ACCESS_KEY:-edge-ro}
      WAF_S3_EDGE_SECRET_KEY: ${WAF_S3_EDGE_SECRET_KEY:-changeme-edge-dev}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    restart: "no"

  # Edge-sync pull sidecar: materialises manifest generations from MinIO onto the
  # same volumes Angie reads, then reloads Angie by signalling the shared Angie
  # pidfile. Profile s3.
  # ponytail: one sidecar against waf-angie-1 (docker-compose can't express true
  # 1:1 pod pairing under --scale). Multi-node 1:1 pairing is k8s's job — see
  # k8s/angie.yaml. For a 2-node demo, run a second compose project or use k8s.
  edge-sync:
    build:
      context: ./gobackend
      dockerfile: Dockerfile.edge-sync
    profiles: ["s3"]
    pid: "service:angie"
    environment:
      # Edge reads with the RO scoped MinIO user (init.sh provisions it).
      WAF_S3_ENDPOINT: minio:9000
      WAF_S3_BUCKET: ${WAF_S3_BUCKET:-waf-state}
      WAF_S3_ACCESS_KEY: ${WAF_S3_EDGE_ACCESS_KEY:-edge-ro}
      WAF_S3_SECRET_KEY: ${WAF_S3_EDGE_SECRET_KEY:-changeme-edge-dev}
      WAF_S3_USE_TLS: "false"
      WAF_EDGE_SYNC_INTERVAL: ${WAF_EDGE_SYNC_INTERVAL:-10}
      # Live tree roots — must match the volume targets below (which Angie reads).
      WAF_TENANTS_DIR: /var/lib/waf/tenants
      WAF_HTTPD_DIR: /var/lib/angie/http.d
      WAF_STATE_DIR: /var/lib/angie/data
      WAF_MODSEC_DIR: /var/lib/angie/modsecurity
      WAF_EDGE_METRICS_ADDR: ":9101"
      # Config is generated by the backend; reload the paired Angie process
      # through the shared PID namespace instead of Docker daemon access.
      WAF_ANGIE_TEST_CMD: ""
      WAF_ANGIE_RELOAD_CMD: kill -HUP $$(cat /run/angie/angie.pid)
    volumes:
      - waf-tenants:/var/lib/waf/tenants
      - ./docker/angie/http.d/:/var/lib/angie/http.d/
      - ./docker/angie/modsecurity/:/var/lib/angie/modsecurity/
      - backend-data:/var/lib/angie/data
      - angie-run:/run/angie
    depends_on:
      - minio
      - minio-init
      - angie
    restart: unless-stopped

volumes:
  grafana-data:
  angie-run:
  minio-data:
  clickhouse:
  crowdsec-db:
  prometheus-storage:
  letsencrypt:
  backend-data:
  postgres-data:
  redis-data:
  # Shared between backend (read/write) and Angie (read-only).
  # Backend writes per-tenant Angie config trees to /var/lib/waf/tenants/.
  # Angie mounts the same volume at /etc/angie/tenants/ and the include
  # glob in angie.conf picks up active tenant configs.
  waf-tenants:
