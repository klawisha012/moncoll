# ==============================================================================
# SECRETS
# Создать перед деплоем:
#   printf 'my_secure_password' | docker secret create clickhouse_password -
# ==============================================================================
secrets:
  clickhouse_password:
    external: true

# ==============================================================================
# CONFIGS
# Создать перед деплоем:
#   docker config create angie_conf        ./configs/angie/angie.conf
#   docker config create angie_default     ./configs/angie/http.d/default.conf
#   docker config create modsecurity_conf  ./configs/angie/modsecurity/modsecurity.conf
#   docker config create modsecurity_rules ./configs/angie/modsecurity/rules.conf
#   docker config create vector_yaml       ./configs/vector/vector.yaml
# ==============================================================================
configs:
  angie_conf:
    external: true
  angie_default:
    external: true
  modsecurity_conf:
    external: true
  modsecurity_rules:
    external: true
  vector_yaml:
    external: true
  # пока что тут заглушка для crowdsec, поскольку не настроен
  crowdsec_conf:
    external: true

networks:
  waf_net:
    driver: overlay
    attachable: true

volumes:
  clickhouse_data:
    driver: local
  angie_logs:
    driver: local
  redis_data:
    driver: local

services:

  # ----------------------------------------------------------------------------
  # Angie (WAF + Reverse Proxy)
  # ----------------------------------------------------------------------------
  angie:
    image: ${REGISTRY:-localhost:5000}/angie-modsec-crs:3.3.5
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - angie_logs:/var/log/angie
      - type: bind
        source: ../../configs/angie/geoip2
        target: /etc/angie/geoip2
    configs:
      - source: angie_conf
        target: /etc/angie/angie.conf
        mode: 0444
      - source: angie_default
        target: /etc/angie/http.d/default.conf
        mode: 0444
      - source: modsecurity_conf
        target: /etc/angie/modsecurity/modsecurity.conf
        mode: 0444
      - source: modsecurity_rules
        target: /etc/angie/modsecurity/rules.conf
        mode: 0444
        # заглушка для crowdsec, поскольку не настроен
      - source: crowdsec_conf
        target: /etc/angie/http.d/crowdsec.conf
        mode: 0444
    networks:
      - waf_net
    env_file:
      - ../../envs/angie.env
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      labels:
        - "com.waf.service=angie"

  # ----------------------------------------------------------------------------
  # Vector
  # ----------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.36.0-debian
    volumes:
      - angie_logs:/var/log/angie:ro
    configs:
      - source: vector_yaml
        target: /etc/vector/vector.yaml
        mode: 0444
    secrets:
      - clickhouse_password
    networks:
      - waf_net
    env_file:
      - ../../envs/vector.env
    environment:
      - CLICKHOUSE_PASSWORD_FILE=/run/secrets/clickhouse_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      labels:
        - "com.waf.service=vector"

  # ----------------------------------------------------------------------------
  # ClickHouse
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    # публикуем сервис наружу, надо будет убрать, небезопасно
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
        mode: ingress
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - type: bind
        source: ../../configs/clickhouse/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
    secrets:
      - clickhouse_password
    networks:
      - waf_net
    env_file:
      - ../../envs/clickhouse.env
    environment:
      - CLICKHOUSE_PASSWORD_FILE=/run/secrets/clickhouse_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.clickhouse == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      labels:
        - "com.waf.service=clickhouse"

  # ----------------------------------------------------------------------------
  # Redis (Cache and Pub/Sub queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redis_data:/data
    networks:
      - waf_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      labels:
        - "com.waf.service=redis"
