apiVersion: 1
datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: bfbcca0459mo0f  # <-- ЗАМЕНИТЬ НА ЭТОТ
    access: proxy
    jsonData:
      server: clickhouse
      port: 8123
      protocol: http
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DB}
      # OpenTelemetry-трассы лежат в БД otel (её создаёт otel-collector). Тот же
      # datasource обслуживает и convergence-дашборд (logs), и Explore → Traces.
      traces:
        defaultDatabase: otel
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: latest
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
    editable: true