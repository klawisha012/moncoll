# Vector Configuration for WAF and GeoIP Logs
# This configuration processes audit.log and geoip.log and sends them to ClickHouse

# Sources: Define where logs come from
sources:
  # Source for ModSecurity audit logs
  waf_audit_source:
    type: file
    include:
      - /var/log/angie/modsec_audit.log
    read_from: end
    fingerprint:
      strategy: device_and_inode

  # Source for GeoIP access logs
  geoip_access_source:
    type: file
    include:
      - /var/log/angie/geoip.log
    read_from: end
    fingerprint:
      strategy: device_and_inode

  # Source for CrowdSec alerts
  crowdsec_alerts_source:
    type: file
    include:
      - /var/log/crowdsec/alerts.log
    read_from: end
    fingerprint:
      strategy: device_and_inode

# Transforms: Parse and structure the logs
transforms:
  # Transform for WAF audit logs
  parse_waf_audit:
    type: remap
    inputs:
      - waf_audit_source
    source: |
      # 1. Safe JSON parsing (Fixes "invalid unicode code point")
      # If the log line contains binary garbage, parse_json returns an error.
      # We catch it and abort processing for this specific event to prevent crash.
      parsed_event, err = parse_json(.message)
      if err != null {
        log("Failed to parse WAF JSON: " + err, level: "warn")
        abort
      }
      . = parsed_event
      
      # 2. Extract transaction data
      .timestamp = parse_timestamp!(.transaction.time_stamp, format: "%a %b %d %H:%M:%S %Y")
      .unique_id = to_string(.transaction.unique_id) ?? ""
      .server_id = to_string(.transaction.server_id) ?? ""
      .client_ip = to_string(.transaction.client_ip) ?? "0.0.0.0"
      .client_port = to_int(.transaction.client_port) ?? 0
      .host_ip = to_string(.transaction.host_ip) ?? "0.0.0.0"
      .host_port = to_int(.transaction.host_port) ?? 0
      
      # 3. Request Data & HEADER FIX
      .request_method = to_string(.transaction.request.method) ?? ""
      .request_http_version = to_string(.transaction.request.http_version) ?? "1.1"
      .request_uri = to_string(.transaction.request.uri) ?? ""
      
      # FIX: Force all header values to strings.
      # ClickHouse Map(String, String) rejects numbers (e.g., Content-Length: 123).
      req_headers = object(.transaction.request.headers) ?? {}
      .request_headers = map_values(req_headers) -> |val| { to_string(val) ?? "" }
      
      # 4. Response Data & Header Fix
      .response_http_code = to_int(.transaction.response.http_code) ?? 0
      
      res_headers = object(.transaction.response.headers) ?? {}
      .response_headers = map_values(res_headers) -> |val| { to_string(val) ?? "" }
      
      # 5. Producer Data
      .producer_modsecurity = to_string(.transaction.producer.modsecurity) ?? ""
      .producer_connector = to_string(.transaction.producer.connector) ?? ""
      .producer_secrules_engine = to_string(.transaction.producer.secrules_engine) ?? ""
      
      # 6. Nested Structures (Parallel Arrays) logic
      # Initialize temp arrays for ClickHouse Nested columns
      ruleIds = []
      severities = []
      messages = []
      datas = []
      files = []
      lineNumbers = []
      matches = []
      
      .messages_tags = []
      .anomaly_score = 0
      
      raw_msgs = array(.transaction.messages) ?? []
      
      for_each(raw_msgs) -> |_index, msg| {
        details = object(msg.details) ?? {}
        
        # Use to_string(...) ?? "" to safely handle nulls and ensure types
        ruleIds = push(ruleIds, to_string(details.ruleId) ?? "")
        severities = push(severities, to_int(details.severity) ?? 0)
        messages = push(messages, to_string(msg.message) ?? "")
        datas = push(datas, to_string(details.data) ?? "")
        files = push(files, to_string(details.file) ?? "")
        lineNumbers = push(lineNumbers, to_string(details.lineNumber) ?? "")
        matches = push(matches, to_string(details.match) ?? "")
        
        # Handle Tags
        tags_raw = array(msg.tags) ?? []
        # Convert tags to strings to avoid type errors
        tags_str = map_values(tags_raw) -> |t| { to_string(t) ?? "" }
        .messages_tags = push(.messages_tags, tags_str)
        
        # Calculate Anomaly Score safely
        if details.ruleId == "949110" {
           score_str = to_string(msg.message) ?? ""
           match_str = to_string(details.match) ?? ""
           
           score_data = parse_regex(score_str, r'Total Score: (?P<score>\d+)') ?? {}
           if is_null(score_data.score) {
              score_data = parse_regex(match_str, r'Value: `(?P<score>\d+)\'') ?? {}
           }
           if !is_null(score_data.score) {
             .anomaly_score = to_int(score_data.score) ?? 0
           }
        }
      }
      
      # Construct the final "messages" object.
      # Vector sends this as a JSON object with array values, 
      # which ClickHouse maps to Nested columns (e.g. messages.ruleId).
      .messages = {
        "ruleId": ruleIds,
        "severity": severities,
        "message": messages,
        "data": datas,
        "file": files,
        "lineNumber": lineNumbers,
        "match": matches
      }

  # Transform for CrowdSec alerts
  parse_crowdsec_alerts:
    type: remap
    inputs:
      - crowdsec_alerts_source
    source: |
      # Parse JSON from CrowdSec alert
      parsed, err = parse_json(.message)
      if err != null {
        log("Failed to parse CrowdSec alert: " + err, level: "warn")
        abort
      }
      . = parsed

      # Extract fields with safe type conversions
      .timestamp = parse_timestamp(.timestamp, format: "%Y-%m-%dT%H:%M:%S.%fZ") ?? now()

      .alert_id = to_string(.alert_id) ?? ""
      .scenario = to_string(.scenario) ?? ""
      .message = to_string(.message) ?? ""

      .source_ip = to_string(.source.ip) ?? "0.0.0.0"
      .source_port = to_int(.source.port) ?? 0

      .scenario_trust = to_string(.scenario_trust) ?? ""
      .scenario_label = to_string(.scenario_label) ?? ""
      .scenario_hub = to_string(.scenario_hub) ?? ""

      .decision_type = to_string(.decision.type) ?? ""
      .decision_duration = to_string(.decision.duration) ?? ""
      .decision_scope = to_string(.decision.scope) ?? ""
      .decision_value = to_string(.decision.value) ?? ""
      .decision_origin = to_string(.decision.origin) ?? ""
      .decision_simulated = to_bool(.decision.simulated) ?? false

      # Handle meta as a map
      .meta = object(.meta) ?? {}

      .capacity = to_int(.capacity) ?? 0
      .leakspeed = to_string(.leakspeed) ?? ""
      .events_count = to_int(.events_count) ?? 0

  # Transform for GeoIP access logs
  parse_geoip_access:
    type: remap
    inputs:
      - geoip_access_source
    source: |
      # Safe parsing
      parsed_event, err = parse_json(.message)
      if err != null {
        log("Failed to parse GeoIP JSON: " + err, level: "warn")
        abort
      }
      . = parsed_event
      
      .time_local = parse_timestamp!(.time_local, format: "%d/%b/%Y:%H:%M:%S %z")
      
      # Safe type conversions
      .remote_addr = to_string(.remote_addr) ?? "0.0.0.0"
      .remote_user = to_string(.remote_user) ?? ""
      .request_method = to_string(.request_method) ?? ""
      .request_uri = to_string(.request_uri) ?? ""
      .server_protocol = to_string(.server_protocol) ?? ""
      .status = to_int(.status) ?? 0
      .body_bytes_sent = to_int(.body_bytes_sent) ?? 0
      .http_referer = to_string(.http_referer) ?? ""
      .http_user_agent = to_string(.http_user_agent) ?? ""
      
      .geoip_country_code = to_string(.geoip.country_code) ?? ""
      .geoip_city_name = to_string(.geoip.city_name) ?? ""
      .geoip_organization = to_string(.geoip.organization) ?? ""
      .geoip_latitude = to_float(.geoip.latitude) ?? 0.0
      .geoip_longitude = to_float(.geoip.longitude) ?? 0.0

      # Server-name / Host header — used for per-domain dashboard filtering
      .host = to_string(.host) ?? ""

  # Filter attacks for real-time threat map (exclude 2xx/3xx clean requests)
  filter_realtime_attacks:
    type: filter
    inputs:
      - parse_geoip_access
    condition: "(to_int(.status) ?? 0) < 200 || (to_int(.status) ?? 0) >= 400"

# Sinks: Define where logs go
sinks:
  # Sink for WAF audit logs to ClickHouse
  waf_audit_sink:
    type: clickhouse
    inputs:
      - parse_waf_audit
    endpoint: "http://clickhouse:8123"
    database: "logs"
    table: "waf_audit_log"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    
    # CRITICAL: Ignore extra fields (host, source_type, etc.) that aren't in the DB schema
    skip_unknown_fields: true
    date_time_best_effort: true 
    
    healthcheck:
      enabled: false
    
    batch:
      max_bytes: 10485760 # 10MB
      timeout_secs: 1.0

  # Sink for GeoIP access logs to ClickHouse
  geoip_access_sink:
    type: clickhouse
    inputs:
      - parse_geoip_access
    endpoint: "http://clickhouse:8123"
    database: "logs"
    table: "nginx_access_log"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"

    # CRITICAL: Ignore extra fields
    skip_unknown_fields: true
    date_time_best_effort: true

    healthcheck:
      enabled: false

    batch:
      max_bytes: 10485760 # 10MB
      timeout_secs: 1.0

  # Sink for live GeoIP events to a durable Redis LIST (not pub/sub). The
  # backend's realtime consumer reliably drains this list (BLMOVE into a
  # processing list, LREM after aggregating), so events published while the
  # consumer is restarting are retained and delivered on return instead of being
  # lost. lpush prepends newest to the head; the consumer pops the oldest (tail)
  # for FIFO. История остаётся в ClickHouse (sink выше) — это push-канал для
  # real-time dashboard.
  geoip_realtime_sink:
    type: redis
    inputs:
      - filter_realtime_attacks
    url: "redis://redis:6379/0"
    key: "attacks:raw"
    data_type: list
    list_option:
      method: lpush
    encoding:
      codec: json
    healthcheck:
      enabled: false

  # Sink for CrowdSec alerts to ClickHouse
  crowdsec_alerts_sink:
    type: clickhouse
    inputs:
      - parse_crowdsec_alerts
    endpoint: "http://clickhouse:8123"
    database: "logs"
    table: "crowdsec_alerts"
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"

    # CRITICAL: Ignore extra fields
    skip_unknown_fields: true
    date_time_best_effort: true

    healthcheck:
      enabled: false

    batch:
      max_bytes: 10485760 # 10MB
      timeout_secs: 1.0

# API and monitoring
api:
  enabled: true
  address: 0.0.0.0:8686
  playground: false
