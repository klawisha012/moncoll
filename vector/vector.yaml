sources:
  angie_logs:
    type: file
    include:
      - /var/log/angie/access.log
    fingerprint:
      strategy: "device_and_inode"

transforms:
  parse_logs:
    type: remap
    inputs:
      - angie_logs
    source: |
      del(.timestamp)
      .message = .message

sinks:
  print_sink:
    type: console
    inputs:
      - parse_logs
    encoding:
      codec: json

  clickhouse_sink:
    type: clickhouse
    inputs:
      - parse_logs
    endpoint: "${CLICKHOUSE_ENDPOINT}"
    database: "${CLICKHOUSE_DB}"
    table: access_logs
    format: json_each_row
    compression: gzip
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 1000
      timeout_secs: 1
    acknowledgements:
      enabled: true
    healthcheck:
      enabled: false