
# УНИВЕРСАЛЬНЫЙ КОНФИГ SWARM
# Работает на любом количестве узлов: 1, 3, N
services:
  angie:
    image: ${REGISTRY:-localhost:5000}/angie-modsec-crs:3.3.5
    build:
      context: .
      dockerfile: angie.Dockerfile
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    volumes:
      - angie-logs:/var/log/angie
      - ./etc/angie/angie.conf:/etc/angie/angie.conf:ro
      - ./etc/angie/http.d/:/etc/angie/http.d/:ro
      - ./etc/angie/modsecurity/:/etc/angie/modsecurity/:ro
      - ./etc/angie/geoip2/:/etc/angie/geoip2/:ro
    env_file:
      - ./envs/angie.env
    depends_on:
      - vector
    networks:
      - waf-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 15s
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G

  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
        mode: ingress
    volumes:
      - grafana-data:/var/lib/grafana
      - ./etc/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    depends_on:
      - clickhouse
    networks:
      - waf-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: []
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  waf-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  angie-logs:
    driver: local
  clickhouse-data:
    driver: local
  grafana-data:
    driver: local
