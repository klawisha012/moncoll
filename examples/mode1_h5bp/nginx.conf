# ──────────────────────────────────────────────────────────────────────────────
# h5bp/server-configs-nginx — WAF integration example
# ──────────────────────────────────────────────────────────────────────────────
# This file is the WAF entrypoint for the h5bp "nginx_config" example.
#
# The WAF backend (backend/src/connections/service.py):
#   1. Expands include directives relative to this file's directory
#      (prefix-anchored, mirroring `nginx -p`).
#   2. Extracts the first server block.
#   3. Strips listen/server_name/ssl_ directives (it manages those itself).
#   4. Re-emits the cleaned body under a managed listen 80 / listen 443 ssl block.
#
# Why a custom nginx.conf instead of upstream's: h5bp partials such as
# `referrer-policy.conf` reference variables (e.g. $referrer_policy) defined
# by `map` blocks in h5bp's top-level nginx.conf — and `map` is only valid in
# the `http {}` context, so we cannot inject it from within `server {}`. We
# therefore include only the variable-free h5bp partials below and inline
# the few security headers that would otherwise require an http-level map.

server {
  # Listen + server_name are stripped by the WAF and re-emitted with the
  # connection's configured domains. Left here for upstream-fidelity.
  listen 80;
  server_name h5bp.local;

  # Static root (rewritten by the WAF onto the per-connection site dir).
  root /var/www/h5bp;
  index index.html;

  # h5bp custom error pages.
  include h5bp/errors/custom_errors.conf;

  # h5bp safe file-access defaults (denies dotfiles, backups, editor turds).
  include h5bp/location/security_file_access.conf;

  # h5bp baseline cache + compression tuning.
  include h5bp/web_performance/cache-file-descriptors.conf;
  include h5bp/web_performance/compression.conf;

  # Inlined security headers that would otherwise need h5bp's http-level maps.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # WAF probe endpoint — ModSecurity is auto-bypassed on /probe by the
  # WAF's _inject_modsec_bypass helper.
  location = /probe {
    default_type text/plain;
    return 200 "mode1-h5bp-ok\n";
  }
}
